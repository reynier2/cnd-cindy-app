<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager Portal — Tito Mel's</title>
<style>
:root{--bg:#140b06;--card:#1f130a;--gold:#ffb703;--red:#e63946;--cream:#fff3e0;--dim:#c9a27a}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--cream);padding:20px;max-width:800px;margin:0 auto}
h1,h2{color:var(--gold);text-align:center;letter-spacing:2px;margin-bottom:20px}
#login-screen, #manager-dashboard { display: none; }
.active { display: block !important; }
input, select {width:100%;background:var(--card);border:1px solid rgba(255,183,3,.3);color:var(--cream);border-radius:8px;padding:12px;margin-bottom:12px;font-size:1rem}
.btn{width:100%;background:var(--gold);border:none;color:#140b06;font-weight:800;padding:14px;border-radius:8px;cursor:pointer;font-size:1rem;margin-top:10px}
.btn-load{background:#333;color:var(--gold);border:1px solid var(--gold);margin-bottom:20px;}
.btn-delete{background:var(--red);color:white;width:auto;padding:8px 16px;font-size:0.85rem;margin:0;border-radius:6px;border:none;cursor:pointer;}
.item-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid rgba(255,183,3,.2);border-radius:8px;padding:12px;margin-bottom:8px}
.item-info{flex:1}
.item-info .cat{color:var(--dim);font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;}
.item-info .name{font-weight:700;font-size:1.05rem;margin:2px 0;}
.item-info .price{color:var(--gold);font-weight:800;font-size:1.1rem;}
#msg{text-align:center;margin:10px 0;font-weight:700;min-height:24px}
.section-box{background:rgba(255,183,3,0.05);border:1px solid var(--gold);border-radius:12px;padding:20px;margin-bottom:30px;}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="active">
  <h1>🔒 MANAGER PORTAL</h1>
  <p style="text-align:center;color:var(--dim);margin-bottom:20px;">Enter passcode to manage the menu.</p>
  <input type="password" id="passcode" placeholder="Enter Passcode">
  <button class="btn" onclick="checkPass()">UNLOCK</button>
  <div id="msg"></div>
</div>

<!-- DASHBOARD SCREEN -->
<div id="manager-dashboard">
  <h1>📝 MENU MANAGER</h1>
  
  <!-- ADD NEW ITEM SECTION -->
  <div class="section-box">
    <h2 style="margin-top:0;font-size:1.2rem;"> ADD NEW ITEM</h2>
    <select id="new-cat">
      <option value="APPETIZERS">APPETIZERS</option>
      <option value="SPECIALS & BBQ">SPECIALS & BBQ</option>
      <option value="ENTREES">ENTREES</option>
      <option value="NOODLES & COMBO">NOODLES & COMBO</option>
      <option value="SIDES">SIDES</option>
      <option value="DRINKS & DESSERTS">DRINKS & DESSERTS</option>
    </select>
    <input id="new-name" placeholder="Item Name (e.g., Chicken Adobo)">
    <input id="new-price" type="number" step="0.01" placeholder="Price (e.g., 8.99)">
    <input id="new-img" placeholder="Image URL (optional)">
    <button class="btn" onclick="addItem()">ADD TO MENU</button>
  </div>

  <!-- LIVE MENU SECTION -->
  <h2 style="font-size:1.2rem;">📋 CURRENT LIVE MENU</h2>
  <p style="text-align:center;color:var(--dim);margin-bottom:10px;font-size:0.9rem;">Click below to load the menu from the database.</p>
  <button class="btn btn-load" onclick="loadMenu()">🔄 LOAD LIVE MENU</button>
  
  <div id="menu-list"></div>
  
  <button class="btn" style="background:#333;color:var(--cream);margin-top:40px;" onclick="logout()">🔒 LOCK & LOGOUT</button>
</div>

<script>
const SUPA = "https://hnwrhbbehjjijoxavwuyq.supabase.co";
const KEY = "sb_publishable_wgehChMt2KQVxpT9DUN16w_qHL0WNje";

function checkPass() {
  if(document.getElementById("passcode").value === "CND-BOSS") {
    document.getElementById("login-screen").classList.remove("active");
    document.getElementById("manager-dashboard").classList.add("active");
    loadMenu(); // Automatically load menu on login
  } else {
    document.getElementById("msg").textContent = "❌ Incorrect passcode.";
    document.getElementById("msg").style.color = "var(--red)";
  }
}

function logout() {
  document.getElementById("manager-dashboard").classList.remove("active");
  document.getElementById("login-screen").classList.add("active");
  document.getElementById("passcode").value = "";
  document.getElementById("msg").textContent = "";
}

async function loadMenu() {
  const list = document.getElementById("menu-list");
  list.innerHTML = "<p style='text-align:center;color:var(--gold);'>Loading menu...</p>";
  
  try {
    const res = await fetch(`${SUPA}/rest/v1/menu_items?order=category.asc,name.asc`, {
      headers: { "apikey": KEY, "Authorization": "Bearer " + KEY }
    });
    const data = await res.json();
    list.innerHTML = "";
    
    if(data.length === 0) {
      list.innerHTML = "<p style='text-align:center;color:var(--dim)'>Menu is empty.</p>";
      return;
    }

    // Group by category for professional look
    let currentCat = "";
    data.forEach(item => {
      if(item.category !== currentCat) {
        currentCat = item.category;
        list.innerHTML += `<h3 style="color:var(--gold);margin:20px 0 10px;font-size:1rem;letter-spacing:2px;border-bottom:1px solid var(--gold);padding-bottom:5px;">${currentCat}</h3>`;
      }
      list.innerHTML += `
        <div class="item-row">
          <div class="item-info">
            <div class="cat">${item.category}</div>
            <div class="name">${item.name}</div>
            <div class="price">$${parseFloat(item.price).toFixed(2)}</div>
          </div>
          <button class="btn-delete" onclick="deleteItem(${item.id})">DELETE</button>
        </div>
      `;
    });
  } catch(e) {
    list.innerHTML = "<p style='text-align:center;color:var(--red);'>Error loading menu. Check console.</p>";
  }
}

async function addItem() {
  const cat = document.getElementById("new-cat").value;
  const name = document.getElementById("new-name").value.trim();
  const price = document.getElementById("new-price").value;
  const img = document.getElementById("new-img").value.trim();

  if(!name || !price) { alert("Please fill in Name and Price."); return; }

  const payload = { category: cat, name: name, price: parseFloat(price), image_url: img };
  
  const response = await fetch(`${SUPA}/rest/v1/menu_items`, {
    method: "POST",
    headers: { "apikey": KEY, "Authorization": "Bearer " + KEY, "Content-Type": "application/json", "Prefer": "return=minimal" },
    body: JSON.stringify(payload)
  });

  if(response.ok) {
    document.getElementById("new-name").value = "";
    document.getElementById("new-price").value = "";
    document.getElementById("new-img").value = "";
    loadMenu(); // Refresh the list
  } else {
    alert("Error adding item. Check console.");
  }
}

async function deleteItem(id) {
  if(!confirm("Delete this item from the live menu?")) return;
  const response = await fetch(`${SUPA}/rest/v1/menu_items?id=eq.${id}`, {
    method: "DELETE",
    headers: { "apikey": KEY, "Authorization": "Bearer " + KEY }
  });
  if(response.ok) loadMenu();
}
</script>
</body>
</html>
