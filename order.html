<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CND - Split Screen Navigation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { margin: 0; padding: 0; background: #050505; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
  
  /* TOP HALF: THE EYES (3D WORLD) */
  #top-view { 
    height: 55vh; width: 100%; position: relative; background: #000;
    border-bottom: 2px solid #ffb703;
  }
  #canvas-container { width: 100%; height: 100%; display: block; }
  
  /* BOTTOM HALF: THE HANDS (NAVIGATION) */
  #bottom-controls { 
    height: 45vh; width: 100%; background: #111; 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 15px; box-sizing: border-box;
  }
  
  h2 { color: #ffb703; margin: 0 0 20px 0; font-size: 1.2rem; letter-spacing: 2px; text-align: center; }
  
  /* D-PAD LAYOUT */
  .dpad {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .dpad-row { display: flex; gap: 10px; }
  
  .dpad-btn {
    width: 70px; height: 70px; border: 2px solid #ffb703; border-radius: 15px;
    background: #1a1a1a; color: #ffb703; font-size: 2rem; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    box-shadow: 0 0 10px rgba(255, 183, 3, 0.2); transition: all 0.1s;
  }
  .dpad-btn:active, .dpad-btn.active {
    background: #ffb703; color: #000; box-shadow: 0 0 20px #ffb703; transform: scale(0.95);
  }

  #live-dot {
    position: absolute; top: 10px; left: 10px; width: 8px; height: 8px;
    background: #00ff00; border-radius: 50%; box-shadow: 0 0 8px #00ff00; z-index: 10;
  }
  #coords {
    position: absolute; bottom: 10px; right: 10px; color: #00ff00; font-family: monospace; font-size: 0.8rem; z-index: 10;
  }
</style>
</head>
<body>

<!-- TOP HALF: THE EYES -->
<div id="top-view">
  <div id="live-dot"></div>
  <div id="coords">X: 0 | Z: 0</div>
  <div id="canvas-container"></div>
</div>

<!-- BOTTOM HALF: THE GAS PEDAL -->
<div id="bottom-controls">
  <h2>NAVIGATE THE WORLD</h2>
  <div class="dpad">
    <button id="btn-up" class="dpad-btn">▲</button>
    <div class="dpad-row">
      <button id="btn-left" class="dpad-btn">◄</button>
      <button id="btn-right" class="dpad-btn">►</button>
    </div>
    <button id="btn-down" class="dpad-btn">▼</button>
  </div>
</div>

<script>
// ==========================================
// CONFIGURATION & SUPABASE
// ==========================================
const SUPABASE_URL = 'https://mkvpuawmkudezotbhmxl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdnB1YXdta3VkZXpvdGJobXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODM0ODUsImV4cCI6MjEwMjc1OTQ4NX0.O5QIeyMGf4Dk3iFw3GagmNWg1t4B2XT0Y1tvanz7hwE';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const KITCHEN_LAYOUT = {
  'Prep Counter': { x: -6, z: -2, w: 4, d: 2, color: 0x444444 },
  'The Grill (Comal)': { x: 0, z: -2, w: 5, d: 2, color: 0x222222 },
  'The Fryer': { x: 6, z: -2, w: 3, d: 2, color: 0x333333 }
};

// ==========================================
// 3D WORLD (TOP HALF)
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.Fog(0x0a0a0a, 10, 40);

const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 5, 10); // Starting position

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.maxPolarAngle = Math.PI / 2 - 0.1; 

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 15, 5);
scene.add(dirLight);

// Floor & Grid
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 20), new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
scene.add(new THREE.GridHelper(30, 30, 0x333333, 0x222222));

// Build Kitchen Objects (The Walls/Boundaries)
Object.keys(KITCHEN_LAYOUT).forEach(stationName => {
  const s = KITCHEN_LAYOUT[stationName];
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(s.w, 1, s.d), new THREE.MeshStandardMaterial({ color: s.color }));
  mesh.position.set(s.x, 0.5, s.z);
  scene.add(mesh);
});

// ==========================================
// NAVIGATION & BOUNDARIES (THE GAS PEDAL)
// ==========================================
const moveState = { up: false, down: false, left: false, right: false };
const speed = 0.15; // The "Gas" speed
const bounds = { xMin: -14, xMax: 14, zMin: -9, zMax: 9 }; // The Walls

function setupDpad() {
  const buttons = {
    up: document.getElementById('btn-up'),
    down: document.getElementById('btn-down'),
    left: document.getElementById('btn-left'),
    right: document.getElementById('btn-right')
  };

  Object.keys(buttons).forEach(dir => {
    const btn = buttons[dir];
    // Handle both touch and mouse
    const startMove = (e) => { e.preventDefault(); moveState[dir] = true; btn.classList.add('active'); };
    const stopMove = (e) => { e.preventDefault(); moveState[dir] = false; btn.classList.remove('active'); };
    
    btn.addEventListener('mousedown', startMove);
    btn.addEventListener('touchstart', startMove, {passive: false});
    btn.addEventListener('mouseup', stopMove);
    btn.addEventListener('mouseleave', stopMove);
    btn.addEventListener('touchend', stopMove);
  });
}

function updateMovement() {
  let dx = 0;
  let dz = 0;

  if (moveState.up) dz -= speed;
  if (moveState.down) dz += speed;
  if (moveState.left) dx -= speed;
  if (moveState.right) dx += speed;

  // Apply movement to camera AND the controls target (so you don't spin out)
  camera.position.x += dx;
  camera.position.z += dz;
  controls.target.x += dx;
  controls.target.z += dz;

  // BOUNDARY CHECK (Hit the wall and stop)
  camera.position.x = Math.max(bounds.xMin, Math.min(bounds.xMax, camera.position.x));
  camera.position.z = Math.max(bounds.zMin, Math.min(bounds.zMax, camera.position.z));
  controls.target.x = Math.max(bounds.xMin, Math.min(bounds.xMax, controls.target.x));
  controls.target.z = Math.max(bounds.zMin, Math.min(bounds.zMax, controls.target.z));

  // Update UI Coordinates
  document.getElementById('coords').innerText = `X: ${camera.position.x.toFixed(1)} | Z: ${camera.position.z.toFixed(1)}`;
}

// ==========================================
// ANIMATION LOOP & STREAM
// ==========================================
function animate() {
  requestAnimationFrame(animate);
  updateMovement(); // The Gas Pedal
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// Keep the Supabase stream alive in the background
supabaseClient.channel('kitchen-stream')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'menu' }, (payload) => {
    console.log('World updated:', payload);
  })
  .subscribe();

// Initialize D-Pad
setupDpad();

</script>
</body>
</html>
