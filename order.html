<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CND - The Eyes (Live 3D Stream)</title>
<!-- Three.js & OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; display: block; }
  
  /* Minimal UI Overlay */
  #ui-overlay {
    position: absolute;
    top: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    pointer-events: none; 
    z-index: 10;
  }
  #ui-overlay h1 {
    color: #ffb703;
    font-size: 1.2rem;
    letter-spacing: 3px;
    margin: 0;
    text-shadow: 0 0 10px #000;
  }
  #ui-overlay p {
    color: #888;
    font-size: 0.8rem;
    margin: 5px 0 0 0;
  }
  #live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #00ff00;
    border-radius: 50%;
    box-shadow: 0 0 8px #00ff00;
    margin-right: 5px;
  }
</style>
</head>
<body>

<div id="ui-overlay">
  <h1>CND DIGITAL TWIN</h1>
  <p><span id="live-dot"></span> LIVE STREAM ACTIVE</p>
</div>

<div id="canvas-container"></div>

<script>
// ==========================================
// CONFIGURATION
// ==========================================
const SUPABASE_URL = 'https://mkvpuawmkudezotbhmxl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdnB1YXdta3VkZXpvdGJobXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODM0ODUsImV4cCI6MjEwMjc1OTQ4NX0.O5QIeyMGf4Dk3iFw3GagmNWg1t4B2XT0Y1tvanz7hwE';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// THE KITCHEN BLUEPRINT (Exact match to Manager Board)
const KITCHEN_LAYOUT = {
  'Prep Counter': { x: -6, z: -2, w: 4, d: 2, color: 0x444444, items: ['Tacos', 'Gorditas', 'Sopes'] },
  'The Grill (Comal)': { x: 0, z: -2, w: 5, d: 2, color: 0x222222, items: ['Quesabirrias', 'Burritos', 'Pollo Frito Chapin'] },
  'The Fryer': { x: 6, z: -2, w: 3, d: 2, color: 0x333333, items: ['Flautas de Pollo'] },
  'Pickup Window': { x: 0, z: 4, w: 8, d: 1, color: 0x1a1a1a, items: [] }
};

let itemMarkers = {}; 

// ==========================================
// 3D WORLD SETUP (The Eyes)
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.Fog(0x0a0a0a, 10, 40);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 8, 12); 

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// OrbitControls: Allows 360 looking around
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2 - 0.1; 

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 15, 5);
dirLight.castShadow = true;
scene.add(dirLight);

// Floor & Grid
const floorGeo = new THREE.PlaneGeometry(30, 20);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
scene.add(new THREE.GridHelper(30, 30, 0x333333, 0x222222));

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ==========================================
// BUILD THE 3D KITCHEN
// ==========================================
function buildKitchen() {
  Object.keys(KITCHEN_LAYOUT).forEach(stationName => {
    const s = KITCHEN_LAYOUT[stationName];
    
    const geo = new THREE.BoxGeometry(s.w, 1, s.d);
    const mat = new THREE.MeshStandardMaterial({ color: s.color, roughness: 0.7 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(s.x, 0.5, s.z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    s.items.forEach((itemName, index) => {
      const markerGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 32);
      const markerMat = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x004400, metalness: 0.5 });
      const marker = new THREE.Mesh(markerGeo, markerMat);
      
      const spacing = s.w / (s.items.length + 1);
      marker.position.set(s.x - (s.w/2) + (spacing * (index + 1)), 1.15, s.z);
      marker.castShadow = true;
      scene.add(marker);
      
      itemMarkers[itemName] = marker;
    });
  });
}

// ==========================================
// UPDATE 3D OBJECTS
// ==========================================
function updateMarkerColor(name, status) {
  if (itemMarkers[name]) {
    let color = 0x00ff00; 
    let emissive = 0x004400;
    
    if (status === 'yellow') { color = 0xffb703; emissive = 0x442200; }
    if (status === 'red') { color = 0xe63946; emissive = 0x440000; }
    
    itemMarkers[name].material.color.setHex(color);
    itemMarkers[name].material.emissive.setHex(emissive);
  }
}

// ==========================================
// THE LIVE STREAM (Supabase Realtime)
// ==========================================
async function initStream() {
  // 1. Get initial state
  const { data } = await supabaseClient.from('menu').select('*');
  if (data) {
    data.forEach(item => updateMarkerColor(item.name, item.status));
  }

  // 2. Open the Realtime WebSocket Stream
  const channel = supabaseClient
    .channel('kitchen-stream')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'menu' }, (payload) => {
      // THIS IS THE MAGIC: The moment the Kitchen Board changes, this fires instantly.
      console.log('Stream received:', payload.new.name, payload.new.status);
      updateMarkerColor(payload.new.name, payload.new.status);
    })
    .subscribe();
}

// ==========================================
// INITIALIZE
// ==========================================
buildKitchen();
initStream();

</script>
</body>
</html>
