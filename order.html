<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tito Mel's — Order for Pickup</title>
<style>
  :root{--bg:#140b06;--card:#1f130a;--gold:#ffb703;--red:#e63946;--cream:#fff3e0;--dim:#c9a27a}
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{background:var(--bg);color:var(--cream);padding:16px;max-width:640px;margin:0 auto;padding-bottom:80px}
  h1{color:var(--gold);text-align:center;letter-spacing:4px;margin:14px 0 4px}
  .sub{color:var(--dim);text-align:center;font-size:.85rem;margin-bottom:16px}
  h3{color:var(--gold);letter-spacing:2px;margin:18px 0 8px;font-size:.95rem}
  .row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid rgba(255,183,3,.2);border-radius:10px;padding:10px 12px;margin-bottom:8px;gap:8px}
  .row.sold-out{opacity:0.4;pointer-events:none;border-color:#555}
  .row .n{font-size:.95rem}
  .row .p{color:var(--gold);font-weight:700;font-size:.85rem;margin-left:8px}
  .qty{display:flex;gap:8px;align-items:center}
  .qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font-weight:800;cursor:pointer;font-size:1.2rem}
  .qty span{min-width:18px;text-align:center;font-weight:800;font-size:1.1rem}
  input,select,textarea{width:100%;background:var(--card);border:1px solid rgba(255,183,3,.3);color:var(--cream);border-radius:10px;padding:12px;margin-bottom:10px;font-size:1rem}
  .send{width:100%;background:linear-gradient(135deg,var(--gold),#fb8500);border:none;color:#140b06;font-weight:800;letter-spacing:1px;padding:16px;border-radius:30px;font-size:1.05rem;cursor:pointer;box-shadow:0 0 22px rgba(255,183,3,.5);margin-top:10px}
  .send:disabled{opacity:0.6;cursor:not-allowed}
  #msg{text-align:center;margin:14px 0;font-weight:700;min-height:24px}
  .sold-tag{color:var(--red);font-weight:bold;font-size:0.8rem;margin-left:10px}
</style>
</head>
<body>

<h1>TITO MEL'S</h1>
<div class="sub">ORDER FOR PICKUP · PAY AT THE COUNTER</div>

<!-- Menu loads here dynamically -->
<div id="menu">Loading menu availability...</div>

<h3>YOUR INFO</h3>
<input id="cname" placeholder="Your name">
<input id="cphone" placeholder="Phone number" type="tel">
<select id="cpickup">
  <option value="ASAP">Pickup: ASAP</option>
  <option value="In 30 min">In 30 minutes</option>
  <option value="In 1 hour">In 1 hour</option>
</select>
<textarea id="cnote" rows="2" placeholder="Notes (no onions, extra sauce...)"></textarea>

<button class="send" id="send">🛒 SEND ORDER TO THE KITCHEN</button>
<div id="msg"></div>

<script>
// ==========================================
// CONFIGURATION
// ==========================================
const SUPA = "https://mkvpuawmkudezotbhmxl.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdnB1YXdta3VkZXpvdGJobXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODM0ODUsImV4cCI6MjEwMjc1OTQ4NX0.O5QIeyMGf4Dk3iFw3GagmNWg1t4B2XT0Y1tvanz7hwE";

const $=id=>document.getElementById(id);

// THE MASTER MENU (Prices are here)
const MASTER_MENU = [
  {cat:"APPETIZERS", items:[
    {name:"Lumpia Shanghai Pork (12pc)", price:11.99},
    {name:"Lumpia Shanghai Chicken (12pc)", price:11.99},
    {name:"Lumpia Gulay (1pc)", price:1.50},
    {name:"Lumpia Sariwa (2pc)", price:10.99}
  ]},
  {cat:"SPECIALS & BBQ", items:[
    {name:"Lechon Kawali", price:10.99},
    {name:"Pork Sisig", price:10.99},
    {name:"Chicken BBQ Stick (2pc)", price:7.99},
    {name:"Pork BBQ Stick", price:7.99}
  ]},
  {cat:"ENTREES", items:[
    {name:"Chicken Adobo", price:8.99},
    {name:"Pork Adobo", price:8.99},
    {name:"Chicken Curry", price:8.99},
    {name:"Menudo", price:8.99},
    {name:"Bicol Express", price:8.99},
    {name:"Kaldereta", price:10.25},
    {name:"Chicken Tinola", price:8.99},
    {name:"Pork Sinigang", price:8.99},
    {name:"Pork Dinuguan", price:8.99}
  ]},
  {cat:"NOODLES & COMBO", items:[
    {name:"Pancit Bihon", price:10.99},
    {name:"Palabok", price:11.99},
    {name:"Combo (2 entrees + side)", price:14.99}
  ]},
  {cat:"SIDES", items:[
    {name:"Plain Rice", price:1.99},
    {name:"Adobo Rice", price:2.99},
    {name:"Plantains", price:2.99},
    {name:"Stir Fry Vegetables", price:4.99}
  ]},
  {cat:"DRINKS & DESSERTS", items:[
    {name:"Buko Pandan Juice", price:6.25},
    {name:"Mango / Taro Boba", price:6.75},
    {name:"Smoothies", price:6.00},
    {name:"Halo-Halo", price:6.50},
    {name:"Ube Biko", price:5.99}
  ]}
];

const qty = {};
let availableStatus = {}; // Stores 'green', 'yellow', 'red' for each item

// ==========================================
// 1. CHECK MAMA'S BOARD (Fetch Status)
// ==========================================
async function checkAvailability() {
  try {
    const res = await fetch(`${SUPA}/rest/v1/menu_status?select=item_name,status`, {
      headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` }
    });
    const data = await res.json();
    
    // Create a quick lookup: { "Lumpia...": "green", "Adobo": "red" }
    data.forEach(item => {
      availableStatus[item.item_name] = item.status;
    });
    
    renderMenu();
  } catch (e) {
    console.error("Could not check menu status", e);
    renderMenu(); // Show everything if DB fails
  }
}

// ==========================================
// 2. RENDER MENU (Hide Red Items)
// ==========================================
function renderMenu() {
  $("menu").innerHTML = MASTER_MENU.map(cat => {
    let html = `<h3>${cat.cat}</h3>`;
    
    cat.items.forEach(item => {
      const status = availableStatus[item.name] || 'green'; // Default to green if not in DB
      const isSoldOut = status === 'red';
      const isLow = status === 'yellow';
      
      // Create a safe ID for the quantity span
      const safeId = item.name.replace(/[^a-zA-Z0-9]/g, '');
      
      let rowClass = isSoldOut ? 'row sold-out' : 'row';
      let soldTag = isSoldOut ? '<span class="sold-tag">SOLD OUT</span>' : '';
      let lowTag = isLow ? '<span style="color:orange;font-size:0.8rem;margin-left:5px">(Low Stock)</span>' : '';

      html += `
        <div class="${rowClass}">
          <span class="n">
            ${item.name} ${soldTag} ${lowTag}
            <span class="p">$${item.price.toFixed(2)}</span>
          </span>
          ${!isSoldOut ? `
          <span class="qty">
            <button onclick="add('${safeId}', -1, '${item.name}')">−</button>
            <span id="q_${safeId}">0</span>
            <button onclick="add('${safeId}', 1, '${item.name}')">+</button>
          </span>` : ''}
        </div>`;
    });
    return html;
  }).join("");
}

// ==========================================
// 3. CART LOGIC
// ==========================================
window.add = function(id, change, name) {
  qty[name] = Math.max(0, (qty[name] || 0) + change);
  $(`q_${id}`).textContent = qty[name];
}

// ==========================================
// 4. SEND ORDER
// ==========================================
$("send").onclick = async () => {
  // Build list of items with qty > 0
  const itemsToSend = Object.keys(qty).filter(name => qty[name] > 0).map(name => {
    // Find price from master menu
    let price = 0;
    MASTER_MENU.forEach(cat => {
      const found = cat.items.find(i => i.name === name);
      if(found) price = found.price;
    });
    return { name: name, qty: qty[name], price: price };
  });

  if(itemsToSend.length === 0) {
    $("msg").textContent = "⚠️ Please add at least one item.";
    $("msg").style.color = "var(--red)";
    return;
  }

  const customer = $("cname").value.trim();
  const phone = $("cphone").value.trim();
  if(!customer || !phone) {
    $("msg").textContent = "⚠️ Name and Phone are required.";
    $("msg").style.color = "var(--red)";
    return;
  }

  const total = itemsToSend.reduce((sum, i) => sum + (i.price * i.qty), 0);

  $("send").disabled = true;
  $("send").textContent = "Sending...";

  try {
    const res = await fetch(`${SUPA}/rest/v1/orders`, {
      method: "POST",
      headers: {
        'apikey': KEY,
        'Authorization': `Bearer ${KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({
        customer_name: customer,
        phone: phone,
        pickup_time: $("cpickup").value,
        notes: $("cnote").value,
        items: itemsToSend,
        total: total,
        status: 'new'
      })
    });

    if(res.ok) {
      $("msg").textContent = "✅ Order Sent! See you soon.";
      $("msg").style.color = "var(--gold)";
      $("send").textContent = "SENT!";
    } else {
      const err = await res.text();
      $("msg").textContent = "❌ Error: " + err;
      $("send").disabled = false;
      $("send").textContent = "🛒 SEND ORDER";
    }
  } catch(e) {
    $("msg").textContent = "❌ Network Error";
    $("send").disabled = false;
  }
};

// Start
checkAvailability();
</script>
</body>
</html>
