<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CND Live Status Board - Space Edition</title>
<!-- Three.js Library for the 3D Background -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  /* Reset and base styles */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background: #000000; /* Pure black for the 3D space background */
    color: white; 
    overflow-x: hidden;
  }

  /* The 3D Space Background Container */
  #cnd-3d-world {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0; /* Sits behind everything */
  }

  /* The UI Container floats above the 3D world */
  #ui-container {
    position: relative;
    z-index: 10;
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
  }

  h1 { 
    color: gold; 
    margin-bottom: 10px; 
    letter-spacing: 2px; 
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
  }
  
  #status-msg { 
    color: lime; 
    font-weight: bold; 
    height: 24px; 
    margin-bottom: 15px; 
    font-size: 1.1rem; 
    text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
  }
  
  /* Glass-morphism effect for the rows so space shows through */
  .item-row { 
    background: rgba(44, 44, 44, 0.75); 
    backdrop-filter: blur(8px);
    padding: 15px; 
    margin: 12px 0; 
    border-radius: 12px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  
  .item-name { 
    font-size: 1.2rem; 
    font-weight: bold; 
    flex: 1; 
    text-align: left; 
    padding-right: 10px; 
    color: #ffd700; 
  }
  
  .btn-group { display: flex; gap: 12px; }
  
  button { 
    padding: 12px 18px; 
    font-size: 1.2rem; 
    font-weight: bold; 
    border: none; 
    border-radius: 10px; 
    cursor: pointer; 
    color: white; 
    transition: all 0.2s; 
    opacity: 0.4; 
  }
  button:hover { opacity: 0.8; }
  
  .btn-green { background: #28a745; }
  .btn-yellow { background: #ffc107; color: black; }
  .btn-red { background: #dc3545; }
  
  .btn-green.active { opacity: 1; box-shadow: 0 0 20px #28a745; transform: scale(1.1); border: 2px solid white; }
  .btn-yellow.active { opacity: 1; box-shadow: 0 0 20px #ffc107; transform: scale(1.1); border: 2px solid white; }
  .btn-red.active { opacity: 1; box-shadow: 0 0 20px #dc3545; transform: scale(1.1); border: 2px solid white; }
</style>
</head>
<body>

  <!-- 1. The 3D Space Background -->
  <div id="cnd-3d-world"></div>

  <!-- 2. The Floating UI Status Board -->
  <div id="ui-container">
    <h1>🚦 CND Live Status Board 🚦</h1>
    <div id="status-msg">Connecting to CND Network...</div>
    <div id="menu-list"></div>
  </div>

  <!-- 3. Supabase and UI Logic -->
  <script>
    const SUPA = "https://mkvpuawmkudezotbhmxl.supabase.co";
    const KEY  = "sb_publishable_CJZipjuCPS_UIT8h-xtVrw_Jy37Cq9K";

    async function loadMenu() {
      const res = await fetch(`${SUPA}/rest/v1/menu_status?select=item_name,status&order=item_name.asc`, {
        headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` }
      });
      const data = await res.json();
      
      const list = document.getElementById('menu-list');
      list.innerHTML = '';
      
      if (!data || data.length === 0) {
        document.getElementById('status-msg').innerText = "⚠️ No items found. Did you run the SQL insert?";
        document.getElementById('status-msg').style.color = "orange";
        return;
      }
      
      data.forEach(item => {
        const currentStatus = item.status || 'green';
        const itemName = item.item_name;
        const row = document.createElement('div');
        row.className = 'item-row';
        
        row.innerHTML = `
          <div class="item-name">${itemName}</div>
          <div class="btn-group">
            <button class="btn-green ${currentStatus==='green'?'active':''}" onclick="updateStatus(this.dataset.name, 'green')" data-name="${itemName}">🟢 Avail</button>
            <button class="btn-yellow ${currentStatus==='yellow'?'active':''}" onclick="updateStatus(this.dataset.name, 'yellow')" data-name="${itemName}">🟡 Low</button>
            <button class="btn-red ${currentStatus==='red'?'active':''}" onclick="updateStatus(this.dataset.name, 'red')" data-name="${itemName}">🔴 Sold</button>
          </div>
        `;
        list.appendChild(row);
      });
      document.getElementById('status-msg').innerText = "✅ Kitchen is live. Tap a color to change it.";
      document.getElementById('status-msg').style.color = "lime";
    }

    async function updateStatus(itemName, status) {
      document.getElementById('status-msg').innerText = "⏳ Updating CND board...";
      document.getElementById('status-msg').style.color = "yellow";
      
      const encodedName = encodeURIComponent(itemName);
      
      await fetch(`${SUPA}/rest/v1/menu_status?item_name=eq.${encodedName}`, {
        method: 'PATCH',
        headers: { 
          'apikey': KEY, 
          'Authorization': `Bearer ${KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ status: status, updated_at: new Date().toISOString() })
      });
      
      loadMenu();
    }

    loadMenu();
    setInterval(loadMenu, 10000); 
  </script>

  <!-- 4. Outer Space 3D Rendering Logic -->
  <script>
    const container = document.getElementById('cnd-3d-world');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Starfield
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 3000;
    const posArray = new Float32Array(starsCount * 3);
    for(let i = 0; i < starsCount * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 400;
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const starsMaterial = new THREE.PointsMaterial({ size: 0.5, color: 0xffffff });
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    // Drifting Planets
    const planetTypes = [
        { name: 'Mars', color: 0xff4500, size: 8 },
        { name: 'Earth', color: 0x2244ff, size: 10 },
        { name: 'Jupiter', color: 0xd2b48c, size: 20 }
    ];
    let currentPlanetIndex = 0;
    let side = 1;
    const planets = [];

    function spawnPlanet() {
        const type = planetTypes[currentPlanetIndex % planetTypes.length];
        const geometry = new THREE.SphereGeometry(type.size, 32, 32);
        const material = new THREE.MeshBasicMaterial({ color: type.color });
        const planet = new THREE.Mesh(geometry, material);

        planet.position.x = side * 40; 
        planet.position.y = (Math.random() - 0.5) * 20;
        planet.position.z = -200;

        scene.add(planet);
        planets.push(planet);

        side *= -1; 
        currentPlanetIndex++;
    }

    spawnPlanet();
    setInterval(spawnPlanet, 5000);

    function animate() {
        requestAnimationFrame(animate);
        
        starField.position.z += 0.1;
        if (starField.position.z > 50) starField.position.z = 0;

        for (let i = planets.length - 1; i >= 0; i--) {
            planets[i].position.z += 0.3;
            planets[i].rotation.y += 0.005;

            if (planets[i].position.z > 20) {
                scene.remove(planets[i]);
                planets.splice(i, 1);
            }
        }
        
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
