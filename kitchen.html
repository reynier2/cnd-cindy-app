<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna Taqueria - Manager Board</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></scipt>
</head>
<body>

<div class="header">
  <h1>🌮 LUNA TAQUERIA MANAGER BOARD</h1>
  <div class="status-badge">● LIVE</div>
</div>

<div class="main-container">
  <!-- LEFT: ORDERS -->
  <div class="orders-panel">
    <div class="panel-header"><h2>ACTIVE ORDERS</h2></div>
    <div class="orders-scroll" id="active-orders-list">
      <div class="waiting">Waiting for orders...</div>
    </div>
  </div>

  <!-- RIGHT: MENU CONTROLS -->
  <div class="controls-panel">
    <div class="panel-header"><h2>🚦 MENU AVAILABILITY</h2></div>
    <div class="controls-scroll" id="controls-content">
      <div class="waiting">Loading menu...</div>
    </div>
  </div>
</div>

<script>
// ==========================================
// CONFIGURATION
// ==========================================
const SUPABASE_URL = 'https://mkvpuawmkudezotbhmxl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdnB1YXdta3VkZXpvdGJobXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODM0ODUsImV4cCI6MjEwMjc1OTQ4NX0.O5QIeyMGf4Dk3iFw3GagmNWg1t4B2XT0Y1tvanz7hwE';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MENU_CATEGORIES = {
  'Tacos': ['Tacos'],
  'Quesabirrias': ['Quesabirrias'],
  'Gorditas & Sopes': ['Gorditas', 'Sopes'],
  'Burritos': ['Burritos'],
  'Specials': ['Pollo Frito Chapin', 'Flautas de Pollo']
};

let knownOrderIds = new Set();
let ordersData = [];

// ==========================================
// SOUND ALARM
// ==========================================
function playAlarm() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = 880; 
  osc.type = 'square';
  gain.gain.setValueAtTime(0.3, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.8);
}

// ==========================================
// LOAD ORDERS & TIMER
// ==========================================
async function loadOrders() {
  const { data, error } = await supabaseClient
    .from('orders')
    .select('*')
    .neq('status', 'deleted')
    .order('created_at', { ascending: false });

  if (error) { console.error('Order Error:', error); return; }

  data.forEach(o => {
    if (!knownOrderIds.has(o.id) && o.status === 'new') {
      playAlarm();
      knownOrderIds.add(o.id);
    }
  });

  ordersData = data || [];
  renderOrders();
}

function renderOrders() {
  const activeList = document.getElementById('active-orders-list');
  const activeOrders = ordersData.filter(o => o.status !== 'done');
  const doneOrders = ordersData.filter(o => o.status === 'done');

  if (activeOrders.length === 0 && doneOrders.length === 0) {
    activeList.innerHTML = '<div class="waiting">Waiting for orders...</div>';
    return;
  }

  let html = '';
  activeOrders.forEach(o => { html += createOrderCard(o); });

  if (doneOrders.length > 0) {
    html += '<div style="margin-top:30px; border-top:2px dashed #555; padding-top:20px;"><h3 style="color:#888; text-align:center; margin-bottom:15px;">📜 ORDER HISTORY</h3>';
    doneOrders.forEach(o => { html += createOrderCard(o); });
    html += '</div>';
  }

  activeList.innerHTML = html;
}

function createOrderCard(o) {
  const timeAgo = getTimeAgo(new Date(o.created_at));
  const items = o.items || [];
  const total = o.total || 0;
  
  let actionButtons = '';
  if (o.status === 'new') {
    actionButtons = `<button class="btn btn-process" onclick="updateStatus(${o.id}, 'processing')">▶ Start Processing</button>`;
  } else if (o.status === 'processing') {
    actionButtons = `<button class="btn btn-done" onclick="updateStatus(${o.id}, 'done')">✓ Mark Done</button>`;
  }

  const deleteBtn = o.status === 'done' ? `<button class="btn btn-delete" onclick="deleteOrder(${o.id})">🗑️</button>` : '';

  return `
    <div class="order-card status-${o.status}">
      <div class="order-top">
        <span class="order-id">#${o.id} <span style="font-size:12px; color:#888">(${o.status})</span></span>
        <span class="order-timer">⏱️ ${timeAgo}</span>
      </div>
      <div class="order-customer">👤 ${o.customer_name || 'Customer'} | 📞 ${o.phone || 'N/A'} | 🕒 ${o.pickup_time || 'ASAP'}</div>
      <div class="order-items">
        ${items.map(i => `<div class="order-item"><span>${i.qty}x ${i.name}</span><span>$${(i.price * i.qty).toFixed(2)}</span></div>`).join('')}
      </div>
      <div class="order-total">Total: $${parseFloat(total).toFixed(2)}</div>
      <div class="action-btns">
        ${actionButtons}
        ${deleteBtn}
      </div>
    </div>
  `;
}

function getTimeAgo(date) {
  const seconds = Math.floor((new Date() - date) / 1000);
  if (seconds < 60) return `${seconds}s ago`;
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m ago`;
  const hours = Math.floor(minutes / 60);
  return `${hours}h ago`;
}

// ==========================================
// UPDATE STATUS & DELETE
// ==========================================
window.updateStatus = async (id, status) => {
  await supabaseClient.from('orders').update({ status }).eq('id', id);
  loadOrders();
};

window.deleteOrder = async (id) => {
  if(confirm('Permanently delete order #' + id + '?')) {
    await supabaseClient.from('orders').update({ status: 'deleted' }).eq('id', id);
    loadOrders();
  }
};

// ==========================================
// MENU CONTROLS (Right Side)
// ==========================================
async function loadMenu() {
  const { data, error } = await supabaseClient
    .from('menu')
    .select('*')
    .order('category');
    
  if (error) { console.error('Menu Error:', error); return; }
  
  const div = document.getElementById('controls-content');
  div.innerHTML = '';
  
  Object.keys(MENU_CATEGORIES).forEach(cat => {
    const catDiv = document.createElement('div');
    catDiv.className = 'control-category';
    catDiv.innerHTML = `<h3>${cat}</h3>`;
    
    MENU_CATEGORIES[cat].forEach(name => {
      const item = data.find(m => m.name === name);
      if (!item) return;
      
      const currentStatus = item.status || 'green'; 
      
      catDiv.innerHTML += `
        <div class="control-item">
          <div class="control-name">${name}</div>
          <div class="traffic-lights">
            <button class="light-btn light-green ${currentStatus==='green'?'active':''}" onclick="updateMenu('${name}','green')"> Avail</button>
            <button class="light-btn light-yellow ${currentStatus==='yellow'?'active':''}" onclick="updateMenu('${name}','yellow')"> Low</button>
            <button class="light-btn light-red ${currentStatus==='red'?'active':''}" onclick="updateMenu('${name}','red')"> Sold</button>
          </div>
        </div>`;
    });
    div.appendChild(catDiv);
  });
}

window.updateMenu = async (name, status) => {
  // FIX: Removed the alert() so it doesn't block the kitchen workflow
  console.log("Updating:", name, "to", status);
  
  const { data, error } = await supabaseClient
    .from('menu')
    .update({ status: status })
    .eq('name', name)
    .select();
    
  if (error) {
    console.error("DATABASE ERROR:", error);
  } else {
    console.log("SUCCESS! Updated:", data);
    loadMenu(); // Refresh to show the new active state
  }
};

// ==========================================
// INITIAL LOAD & REFRESH
// ==========================================
loadOrders();
loadMenu();

// Poll every 5 seconds for new orders
setInterval(loadOrders, 5000);
// Poll every 10 seconds for menu changes (in case another device changed it)
setInterval(loadMenu, 10000);
// REMOVED: setInterval(renderOrders, 1000) to prevent screen flickering and DOM thrashing
</script>

</body>
</html>
