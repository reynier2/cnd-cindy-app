<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mama's Manager Board</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a0f0a; color: #ffd700; font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
.header { background: #0d0805; padding: 15px 25px; display: flex; justify-content: space-between; border-bottom: 3px solid #ff8c00; }
.header h1 { font-size: 22px; letter-spacing: 2px; color: #ff8c00; }
.status-badge { background: #28a745; color: white; padding: 5px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; }
.main-container { display: grid; grid-template-columns: 1fr 450px; height: calc(100vh - 60px); }
.orders-panel { background: #1a0f0a; border-right: 3px solid #ff8c00; overflow: hidden; display: flex; flex-direction: column; }
.orders-header { background: #0d0805; padding: 15px; border-bottom: 2px solid #ff8c00; text-align: center; }
.orders-header h2 { color: #ff8c00; font-size: 18px; }
.orders-list { flex: 1; overflow-y: auto; padding: 15px; }
.order-card { background: #0d0805; border: 2px solid #ff8c00; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
.order-header { display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #ff8c00; }
.order-id { color: #ffd700; font-weight: bold; }
.order-time { color: #888; font-size: 12px; }
.order-customer { color: #aaa; font-size: 14px; margin-bottom: 8px; }
.order-items { background: #1a0f0a; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
.order-item { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; color: #ccc; }
.order-total { text-align: right; font-size: 18px; font-weight: bold; color: #28a745; }
.order-status { display: inline-block; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; margin-top: 8px; background: #28a745; color: white; }
.controls-panel { background: #0d0805; overflow-y: auto; }
.controls-header { background: #0d0805; padding: 15px; border-bottom: 2px solid #ff8c00; text-align: center; }
.controls-header h2 { color: #ff8c00; font-size: 18px; }
.controls-content { padding: 15px; }
.control-category { margin-bottom: 25px; }
.control-category h3 { color: #ffd700; font-size: 14px; margin-bottom: 12px; padding-left: 10px; border-left: 4px solid #ff8c00; }
.control-item { background: #1a0f0a; border-radius: 8px; padding: 12px; margin-bottom: 10px; border: 1px solid #333; }
.control-name { color: #ffd700; font-size: 13px; margin-bottom: 10px; font-weight: 600; text-align: center; }
.traffic-lights { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.light-btn { height: 45px; border-radius: 6px; border: none; font-weight: bold; font-size: 11px; cursor: pointer; opacity: 0.35; transition: all 0.3s; color: white; }
.light-btn.active { opacity: 1; transform: scale(1.05); box-shadow: 0 0 12px rgba(255,255,255,0.6); border: 2px solid white; }
.light-green { background: #28a745; }
.light-yellow { background: #ffc107; color: black; }
.light-red { background: #dc3545; }
.waiting { text-align: center; padding: 40px 20px; color: #666; font-size: 15px; }
</style>
</head>
<body>

<div class="header">
  <h1>️ MAMA'S MANAGER BOARD</h1>
  <div class="status-badge">● LIVE</div>
</div>

<div class="main-container">
  <div class="orders-panel">
    <div class="orders-header"><h2> INCOMING ORDERS</h2></div>
    <div class="orders-list" id="orders-list"><div class="waiting">Waiting for orders...</div></div>
  </div>
  <div class="controls-panel">
    <div class="controls-header"><h2>🚦 MENU AVAILABILITY</h2></div>
    <div class="controls-content" id="controls-content"><div class="waiting">Loading menu...</div></div>
  </div>
</div>

<script>
// UNIQUE variable name to prevent conflicts
const mamaSupabaseClient = window.supabase.createClient(
  'https://mkvpuawmkudezotbhmxl.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdnB1YXdta3VkZXpvdGJobXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODM0ODUsImV4cCI6MjEwMjc1OTQ4NX0.O5QIeyMGf4Dk3iFw3GagmNWg1t4B2XT0Y1tvanz7hwE'
);

const MENU_CATEGORIES = {
  'Appetizers': ['Lumpia Shanghai Pork (12pc)', 'Lumpia Shanghai Chicken (12pc)', 'Lumpia Gulay (1pc)', 'Lumpia Sariwa (2pc)'],
  'Specials & BBQ': ['Lechon Kawali', 'Pork Sisig', 'Chicken BBQ Stick (2pc)', 'Pork BBQ Stick'],
  'Entrees': ['Chicken Adobo', 'Pork Adobo', 'Chicken Curry']
};

async function loadOrders() {
  const { data, error } = await mamaSupabaseClient.from('orders').select('*').order('created_at', { ascending: false }).limit(20);
  if (error) { console.error('Error:', error); return; }
  const list = document.getElementById('orders-list');
  if (!data || data.length === 0) { list.innerHTML = '<div class="waiting">Waiting for orders...</div>'; return; }
  list.innerHTML = data.map(o => `
    <div class="order-card">
      <div class="order-header"><span class="order-id">#${o.id}</span><span class="order-time">${new Date(o.created_at).toLocaleTimeString()}</span></div>
      <div class="order-customer">👤 ${o.customer_name || 'Customer'} | 📞 ${o.phone || 'N/A'}</div>
      <div class="order-items">${(o.items||[]).map(i => `<div class="order-item"><span>${i.qty}x ${i.name}</span><span>$${(i.price*i.qty).toFixed(2)}</span></div>`).join('')}</div>
      <div class="order-total">Total: $${parseFloat(o.total||0).toFixed(2)}</div>
      <span class="order-status">${o.status || 'new'}</span>
    </div>`).join('');
}

async function loadMenu() {
  const { data, error } = await mamaSupabaseClient.from('menu_status').select('*').order('item_name');
  if (error) { console.error('Error:', error); return; }
  const div = document.getElementById('controls-content');
  div.innerHTML = '';
  Object.keys(MENU_CATEGORIES).forEach(cat => {
    const catDiv = document.createElement('div');
    catDiv.className = 'control-category';
    catDiv.innerHTML = `<h3>${cat}</h3>`;
    MENU_CATEGORIES[cat].forEach(name => {
      const item = data.find(m => m.item_name === name);
      if (!item) return;
      catDiv.innerHTML += `
        <div class="control-item">
          <div class="control-name">${name}</div>
          <div class="traffic-lights">
            <button class="light-btn light-green ${item.status==='green'?'active':''}" onclick="update('${name}','green')">🟢 Avail</button>
            <button class="light-btn light-yellow ${item.status==='yellow'?'active':''}" onclick="update('${name}','yellow')">🟡 Low</button>
            <button class="light-btn light-red ${item.status==='red'?'active':''}" onclick="update('${name}','red')">🔴 Sold</button>
          </div>
        </div>`;
    });
    div.appendChild(catDiv);
  });
}

async function update(name, status) {
  await mamaSupabaseClient.from('menu_status').update({status, updated_at: new Date()}).eq('item_name', name);
  loadMenu();
}

loadOrders();
loadMenu();
setInterval(loadOrders, 5000);
setInterval(loadMenu, 5000);
</script>

</body>
</html>
