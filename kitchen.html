<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CND - Kitchen Command Board (3D)</title>
<!-- Three.js for the 3D World -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  /* Base Layout */
  body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; margin: 0; padding: 10px; }
  
  .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #1a1a1a; border-radius: 8px; margin-bottom: 15px; border-bottom: 2px solid #ffb703; }
  .header h1 { margin: 0; font-size: 1.5rem; color: #ffb703; letter-spacing: 2px; }
  .status-badge { color: #00ff00; font-weight: bold; display: flex; align-items: center; gap: 8px; }
  .status-dot { width: 10px; height: 10px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 10px #00ff00; }

  /* 3D Viewport (The Big World) */
  #viewport-3d { width: 100%; height: 350px; background: #050505; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; position: relative; overflow: hidden; }
  #viewport-label { position: absolute; top: 10px; left: 15px; color: #ffb703; font-weight: bold; letter-spacing: 1px; z-index: 10; pointer-events: none; }

  /* Desktop Side-by-Side Default */
  .main-container { display: flex; gap: 20px; }
  .orders-panel, .controls-panel { flex: 1; background: #1a1a1a; padding: 15px; border-radius: 8px; min-height: 400px; border: 1px solid #333; }
  .panel-header h2 { color: #ffb703; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 0; }

  /* Order Cards */
  .order-card { background: #252525; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #ffb703; }
  .order-card.status-processing { border-left-color: #00ff00; }
  .order-card.status-done { border-left-color: #555; opacity: 0.6; }
  .order-top { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }
  .order-items { font-size: 0.9rem; color: #ccc; margin: 10px 0; }
  .order-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #333; }
  .order-total { font-weight: bold; color: #ffb703; text-align: right; margin-top: 8px; }
  
  /* Buttons */
  .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; transition: 0.2s; }
  .btn-process { background: #ffb703; color: #000; }
  .btn-done { background: #00ff00; color: #000; }
  .btn-delete { background: #e63946; color: #fff; width: auto; padding: 5px 10px; font-size: 0.8rem; }

  /* Traffic Lights */
  .control-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #252525; border-radius: 6px; margin-bottom: 8px; }
  .traffic-lights { display: flex; gap: 5px; }
  .light-btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; opacity: 0.4; transition: 0.2s; }
  .light-btn.active { opacity: 1; transform: scale(1.1); box-shadow: 0 0 8px currentColor; }
  .light-green { background: #00ff00; color: #000; }
  .light-yellow { background: #ffb703; color: #000; }
  .light-red { background: #e63946; color: #fff; }

  /* Mobile Dress */
  @media (max-width: 768px) {
    .main-container { flex-direction: column; }
    #viewport-3d { height: 250px; }
    .btn, .light-btn { padding: 12px !important; font-size: 16px !important; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🌮 CND KITCHEN COMMAND</h1>
  <div class="status-badge"><div class="status-dot"></div> LIVE</div>
</div>

<!-- THE 3D WORLD VIEWPORT -->
<div id="viewport-3d">
  <div id="viewport-label">🌐 THE BIG WORLD (3D PROJECTION)</div>
</div>

<div class="main-container">
  <!-- LEFT: ORDERS -->
  <div class="orders-panel">
    <div class="panel-header"><h2>📋 ACTIVE ORDERS</h2></div>
    <div id="active-orders-list"><div style="color:#888; text-align:center; padding:20px;">Waiting for orders...</div></div>
  </div>

  <!-- RIGHT: MENU CONTROLS -->
  <div class="controls-panel">
    <div class="panel-header"><h2>🚦 MENU AVAILABILITY</h2></div>
    <div id="controls-content"><div style="color:#888; text-align:center; padding:20px;">Loading menu...</div></div>
  </div>
</div>

<script>
// ==========================================
// CONFIGURATION
// ==========================================
const SUPABASE_URL = 'https://mkvpuawmkudezotbhmxl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdnB1YXdta3VkZXpvdGJobXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODM0ODUsImV4cCI6MjEwMjc1OTQ4NX0.O5QIeyMGf4Dk3iFw3GagmNWg1t4B2XT0Y1tvanz7hwE';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MENU_CATEGORIES = {
  'Tacos': ['Tacos'],
  'Quesabirrias': ['Quesabirrias'],
  'Gorditas & Sopes': ['Gorditas', 'Sopes'],
  'Burritos': ['Burritos'],
  'Specials': ['Pollo Frito Chapin', 'Flautas de Pollo']
};

let knownOrderIds = new Set();
let ordersData = [];
let menu3DObjects = {}; // Stores the 3D meshes linked to menu items

// ==========================================
// 3D WORLD SETUP (Three.js)
// ==========================================
const viewport = document.getElementById('viewport-3d');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.Fog(0x050505, 10, 50);

const camera = new THREE.PerspectiveCamera(60, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
camera.position.set(0, 5, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
viewport.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// Floor
const floorGeo = new THREE.PlaneGeometry(30, 30);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// Animation Loop
function animate() {
  requestAnimationFrame(animate);
  // Slow rotation for the "Big World" feel
  scene.rotation.y += 0.001; 
  renderer.render(scene, camera);
}
animate();

// Handle window resize
window.addEventListener('resize', () => {
  camera.aspect = viewport.clientWidth / viewport.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(viewport.clientWidth, viewport.clientHeight);
});

// ==========================================
// SOUND ALARM
// ==========================================
function playAlarm() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.frequency.value = 880; osc.type = 'square';
  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
  osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.5);
}

// ==========================================
// LOAD ORDERS
// ==========================================
async function loadOrders() {
  const { data, error } = await supabaseClient.from('orders').select('*').neq('status', 'deleted').order('created_at', { ascending: false });
  if (error) return;

  data.forEach(o => {
    if (!knownOrderIds.has(o.id) && o.status === 'new') { playAlarm(); knownOrderIds.add(o.id); }
  });
  ordersData = data || [];
  renderOrders();
}

function renderOrders() {
  const activeList = document.getElementById('active-orders-list');
  const activeOrders = ordersData.filter(o => o.status !== 'done');
  const doneOrders = ordersData.filter(o => o.status === 'done');

  if (activeOrders.length === 0 && doneOrders.length === 0) {
    activeList.innerHTML = '<div style="color:#888; text-align:center; padding:20px;">Waiting for orders...</div>';
    return;
  }

  let html = '';
  activeOrders.forEach(o => { html += createOrderCard(o); });
  if (doneOrders.length > 0) {
    html += '<div style="margin-top:30px; border-top:2px dashed #333; padding-top:20px;"><h3 style="color:#666; text-align:center;">📜 HISTORY</h3>';
    doneOrders.forEach(o => { html += createOrderCard(o); });
    html += '</div>';
  }
  activeList.innerHTML = html;
}

function createOrderCard(o) {
  const timeAgo = getTimeAgo(new Date(o.created_at));
  const items = o.items || [];
  const total = o.total || 0;
  
  let actionButtons = '';
  if (o.status === 'new') actionButtons = `<button class="btn btn-process" onclick="updateStatus(${o.id}, 'processing')">▶ START</button>`;
  else if (o.status === 'processing') actionButtons = `<button class="btn btn-done" onclick="updateStatus(${o.id}, 'done')">✓ DONE</button>`;
  const deleteBtn = o.status === 'done' ? `<button class="btn btn-delete" onclick="deleteOrder(${o.id})">🗑️</button>` : '';

  return `
    <div class="order-card status-${o.status}">
      <div class="order-top"><span>#${o.id} (${o.status})</span><span>⏱️ ${timeAgo}</span></div>
      <div style="font-size:0.9rem; color:#aaa;">👤 ${o.customer_name || 'Guest'} | 📞 ${o.phone || 'N/A'} | 🕒 ${o.pickup_time || 'ASAP'}</div>
      <div class="order-items">${items.map(i => `<div class="order-item"><span>${i.qty}x ${i.name}</span><span>$${(i.price * i.qty).toFixed(2)}</span></div>`).join('')}</div>
      <div class="order-total">Total: $${parseFloat(total).toFixed(2)}</div>
      <div style="display:flex; gap:10px;">${actionButtons} ${deleteBtn}</div>
    </div>`;
}

function getTimeAgo(date) {
  const seconds = Math.floor((new Date() - date) / 1000);
  if (seconds < 60) return `${seconds}s`;
  const minutes = Math.floor(seconds / 60);
  return `${minutes}m`;
}

window.updateStatus = async (id, status) => { await supabaseClient.from('orders').update({ status }).eq('id', id); loadOrders(); };
window.deleteOrder = async (id) => { if(confirm('Delete order #' + id + '?')) { await supabaseClient.from('orders').update({ status: 'deleted' }).eq('id', id); loadOrders(); } };

// ==========================================
// MENU CONTROLS & 3D SYNC
// ==========================================
async function loadMenu() {
  const { data, error } = await supabaseClient.from('menu').select('*').order('category');
  if (error) return;
  
  const div = document.getElementById('controls-content');
  div.innerHTML = '';
  
  // Clear old 3D objects if menu reloaded
  Object.values(menu3DObjects).forEach(mesh => scene.remove(mesh));
  menu3DObjects = {};

  let xPos = -4; // Starting X position for 3D blocks
  
  Object.keys(MENU_CATEGORIES).forEach(cat => {
    const catDiv = document.createElement('div');
    catDiv.className = 'control-category';
    catDiv.innerHTML = `<h3 style="color:#ffb703; margin-bottom:10px;">${cat}</h3>`;
    
    MENU_CATEGORIES[cat].forEach(name => {
      const item = data.find(m => m.name === name);
      if (!item) return;
      
      const currentStatus = item.status || 'green'; 
      
      // --- CREATE 3D OBJECT FOR THIS ITEM ---
      const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
      let color = 0x00ff00; // Green
      if (currentStatus === 'yellow') color = 0xffb703;
      if (currentStatus === 'red') color = 0xe63946;
      
      const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.2 });
      const cube = new THREE.Mesh(geometry, material);
      cube.position.set(xPos, 0.75, 0);
      scene.add(cube);
      menu3DObjects[name] = cube; // Store reference
      xPos += 2.2; // Space them out

      // --- CREATE 2D CONTROL BUTTONS ---
      catDiv.innerHTML += `
        <div class="control-item">
          <div style="font-weight:bold;">${name}</div>
          <div class="traffic-lights">
            <button class="light-btn light-green ${currentStatus==='green'?'active':''}" onclick="updateMenu('${name}','green')"> Avail</button>
            <button class="light-btn light-yellow ${currentStatus==='yellow'?'active':''}" onclick="updateMenu('${name}','yellow')"> Low</button>
            <button class="light-btn light-red ${currentStatus==='red'?'active':''}" onclick="updateMenu('${name}','red')"> Sold</button>
          </div>
        </div>`;
    });
    div.appendChild(catDiv);
  });
}

window.updateMenu = async (name, status) => {
  console.log("Updating:", name, "to", status);
  const { error } = await supabaseClient.from('menu').update({ status: status }).eq('name', name);
  if (error) console.error(error);
  else loadMenu(); // Refresh 2D and 3D
};

// ==========================================
// INITIAL LOAD & REFRESH
// ==========================================
loadOrders();
loadMenu();
setInterval(loadOrders, 5000);
setInterval(loadMenu, 10000);
</script>
</body>
</html>
