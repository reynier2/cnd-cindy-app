<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CND City - Detailed Aerial View</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">CND City - Detailed Aerial View<br>Drag to rotate | Scroll to zoom</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd4a373);
        scene.fog = new THREE.FogExp2(0xd4a373, 0.002);

        // Camera
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(60, 90, 60);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 20;
        controls.maxDistance = 250;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffaa55, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffd700, 1.5);
        dirLight.position.set(100, 120, 80);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -150;
        dirLight.shadow.camera.right = 150;
        dirLight.shadow.camera.top = 150;
        dirLight.shadow.camera.bottom = -150;
        dirLight.shadow.mapSize.width = 4096;
        dirLight.shadow.mapSize.height = 4096;
        scene.add(dirLight);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(400, 400);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a5f3a });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Roads
        function createRoad(x, z, width, length, rotation) {
            const roadGeo = new THREE.PlaneGeometry(width, length);
            const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.rotation.z = rotation;
            road.position.set(x, 0.05, z);
            road.receiveShadow = true;
            scene.add(road);

            const lineGeo = new THREE.PlaneGeometry(0.5, length);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.rotation.z = rotation;
            line.position.set(x, 0.06, z);
            scene.add(line);
        }

        createRoad(0, 0, 14, 400, 0);
        createRoad(0, 0, 14, 400, Math.PI / 2);

        // --- TEXTURE GENERATOR FOR WINDOWS & DOORS ---
        function createBuildingTexture(baseColorHex, hasDoor) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; 
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Base wall color
            ctx.fillStyle = '#' + new THREE.Color(baseColorHex).getHexString();
            ctx.fillRect(0, 0, 128, 256);

            // Windows
            for(let y = 20; y < 230; y += 35) {
                for(let x = 15; x < 115; x += 35) {
                    // Window frame
                    ctx.fillStyle = '#222222';
                    ctx.fillRect(x - 2, y - 2, 24, 29);
                    
                    // Glass (randomly lit or dark)
                    const isLit = Math.random() > 0.4;
                    ctx.fillStyle = isLit ? '#ffeeaa' : '#1a1a2e';
                    ctx.fillRect(x, y, 20, 25);
                }
            }

            // Door at the bottom
            if (hasDoor) {
                ctx.fillStyle = '#222222'; // Door frame
                ctx.fillRect(40, 195, 48, 61);
                ctx.fillStyle = '#4a3728'; // Door wood
                ctx.fillRect(44, 199, 40, 57);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; // Keeps it crisp
            return tex;
        }

        // Expanded realistic color palette
        const buildingColors = [
            0xE8DCC4, // Beige
            0xC2B280, // Sand
            0xA0522D, // Terracotta
            0x87CEEB, // Light Blue
            0xF5F5DC, // Cream
            0xD3D3D3, // Light Grey
            0xBC8F8F  // Rosy Brown
        ];
        
        function createBuilding(x, z, width, height, depth, color) {
            const isStreetLevel = height < 20;
            const texture = createBuildingTexture(color, isStreetLevel);
            
            const material = new THREE.MeshLambertMaterial({ map: texture });
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const building = new THREE.Mesh(geometry, material);
            
            building.position.set(x, height / 2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);

            // Rooftop details
            if (height > 25 && Math.random() > 0.3) {
                const acGeo = new THREE.BoxGeometry(2, 1.5, 2);
                const acMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
                for(let i=0; i<3; i++) {
                    const ac = new THREE.Mesh(acGeo, acMat);
                    ac.position.set(
                        x + (Math.random() - 0.5) * (width - 3), 
                        height + 0.75, 
                        z + (Math.random() - 0.5) * (depth - 3)
                    );
                    ac.castShadow = true;
                    scene.add(ac);
                }
            }
        }

        // Generate city
        for (let i = 0; i < 120; i++) {
            const x = (Math.random() - 0.5) * 250;
            const z = (Math.random() - 0.5) * 250;
            
            if (Math.abs(x) < 30 && Math.abs(z) < 30) continue;
            if (Math.abs(x) < 10 || Math.abs(z) < 10) continue; 
            
            const width = 8 + Math.random() * 10;
            const height = 10 + Math.random() * 35;
            const depth = 8 + Math.random() * 10;
            const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
            
            createBuilding(x, z, width, height, depth, color);
        }

        // Cathedral Plaza & Cathedral
        function createCathedral() {
            const plazaGeo = new THREE.PlaneGeometry(60, 60);
            const plazaMat = new THREE.MeshLambertMaterial({ color: 0x999999 });
            const plaza = new THREE.Mesh(plazaGeo, plazaMat);
            plaza.rotation.x = -Math.PI / 2;
            plaza.position.y = 0.08;
            plaza.receiveShadow = true;
            scene.add(plaza);

            const cathedralGroup = new THREE.Group();

            const mainGeo = new THREE.BoxGeometry(22, 18, 35);
            const mainMat = new THREE.MeshLambertMaterial({ color: 0xF5F5DC });
            const main = new THREE.Mesh(mainGeo, mainMat);
            main.position.y = 9;
            main.castShadow = true;
            main.receiveShadow = true;
            cathedralGroup.add(main);

            const domeGeo = new THREE.SphereGeometry(9, 32, 32);
            const domeMat = new THREE.MeshLambertMaterial({ color: 0xDDA0DD });
            const dome = new THREE.Mesh(domeGeo, domeMat);
            dome.position.set(0, 20, 0);
            dome.scale.set(1, 0.6, 1);
            dome.castShadow = true;
            cathedralGroup.add(dome);

            const towerGeo = new THREE.BoxGeometry(5, 30, 5);
            const towerMat = new THREE.MeshLambertMaterial({ color: 0xF5F5DC });
            const leftTower = new THREE.Mesh(towerGeo, towerMat);
            leftTower.position.set(-9, 15, 0);
            leftTower.castShadow = true;
            cathedralGroup.add(leftTower);

            const rightTower = new THREE.Mesh(towerGeo, towerMat);
            rightTower.position.set(9, 15, 0);
            rightTower.castShadow = true;
            cathedralGroup.add(rightTower);

            const smallDomeGeo = new THREE.SphereGeometry(3, 16, 16);
            const smallDomeMat = new THREE.MeshLambertMaterial({ color: 0xDDA0DD });
            
            const leftDome = new THREE.Mesh(smallDomeGeo, smallDomeMat);
            leftDome.position.set(-9, 31, 0);
            cathedralGroup.add(leftDome);

            const rightDome = new THREE.Mesh(smallDomeGeo, smallDomeMat);
            rightDome.position.set(9, 31, 0);
            cathedralGroup.add(rightDome);

            const crossMat = new THREE.MeshBasicMaterial({ color: 0xFFD700 });
            [ [0, 24, 0], [-9, 33, 0], [9, 33, 0] ].forEach(pos => {
                const v = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.5, 0.5), crossMat);
                v.position.set(...pos);
                cathedralGroup.add(v);
                const h = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 0.5), crossMat);
                h.position.set(pos[0], pos[1] + 0.5, pos[2]);
                cathedralGroup.add(h);
            });

            scene.add(cathedralGroup);
        }
        createCathedral();

        // Streetlights
        function createStreetlight(x, z) {
            const poleGeo = new THREE.CylinderGeometry(0.2, 0.2, 8, 8);
            const poleMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.set(x, 4, z);
            pole.castShadow = true;
            scene.add(pole);

            const bulbGeo = new THREE.SphereGeometry(0.8, 8, 8);
            const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffeeaa });
            const bulb = new THREE.Mesh(bulbGeo, bulbMat);
            bulb.position.set(x, 8.5, z);
            scene.add(bulb);

            const light = new THREE.PointLight(0xffeeaa, 0.5, 15);
            light.position.set(x, 8.5, z);
            scene.add(light);
        }

        for (let i = -120; i <= 120; i += 20) {
            if (Math.abs(i) > 15) {
                createStreetlight(i, 8);
                createStreetlight(i, -8);
                createStreetlight(8, i);
                createStreetlight(-8, i);
            }
        }

        // Layered Mountains
        function createMountains() {
            const colors = [0x6B5B73, 0x5A4A63, 0x4A3A53];
            const positions = [
                { x: -180, z: -160, s: 1.2 }, { x: -100, z: -180, s: 1.5 }, 
                { x: 0, z: -190, s: 1.8 }, { x: 100, z: -180, s: 1.5 }, 
                { x: 180, z: -160, s: 1.2 },
                { x: -140, z: -170, s: 1.0 }, { x: 140, z: -170, s: 1.0 }
            ];

            positions.forEach((pos, idx) => {
                const mountainGeo = new THREE.ConeGeometry(50 * pos.s, 90 * pos.s, 5);
                const mountainMat = new THREE.MeshLambertMaterial({ 
                    color: colors[idx % 3],
                    flatShading: true
                });
                const mountain = new THREE.Mesh(mountainGeo, mountainMat);
                mountain.position.set(pos.x, 45 * pos.s, pos.z);
                mountain.castShadow = true;
                mountain.receiveShadow = true;
                scene.add(mountain);
            });
        }
        createMountains();

        // Trees
        function createTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 2, 6);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x4A3728 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 1, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const leavesGeo = new THREE.ConeGeometry(2.5, 6, 8);
            const leavesMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, 4.5, z);
            leaves.castShadow = true;
            scene.add(leaves);
        }

        for (let i = -120; i <= 120; i += 12) {
            if (Math.abs(i) > 20) {
                createTree(i + 10, -120);
                createTree(i + 10, 120);
                createTree(-120, i + 10);
                createTree(120, i + 10);
            }
        }

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
