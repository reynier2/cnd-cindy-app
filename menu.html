<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CND Digital - 3D Environment</title>
    
    <!-- 1. THE STYLES -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #1a1a1a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #cnd-3d-world {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #cnd-ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none; 
        }
    </style>

    <!-- 2. THE 3D ENGINE (Outside the style tags!) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- The 3D Canvas Container -->
    <div id="cnd-3d-world"></div>

    <!-- Simple Status Overlay -->
    <div id="cnd-ui-overlay">
        CND Digital Environment: <span id="connection-status">Initializing...</span>
    </div>

    <!-- 3. THE LOGIC -->
    <script>
<script>
    // --- 3D AVATAR SETUP ---
    
    // 1. Create the Scene (The World)
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a); // Dark background

    // 2. Create the Camera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    // 3. Create the Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('cnd-3d-world').appendChild(renderer.domElement);

    // 4. Add lights so we can see the materials
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 5, 5);
    scene.add(light);
    
    const ambientLight = new THREE.AmbientLight(0x404040); 
    scene.add(ambientLight);

    // STEP 1: Define the Iron Man Materials
    const redMaterial = new THREE.MeshStandardMaterial({ 
        color: 0xdc143c,      // Crimson Red
        metalness: 0.6,       // Slightly metallic
        roughness: 0.4        // Smooth finish
    });

    const goldMaterial = new THREE.MeshStandardMaterial({ 
        color: 0xffd700,      // Metallic Gold
        metalness: 0.9,       // Very metallic
        roughness: 0.3        // Polished shine
    });
    
    // -------------------------
    
    document.getElementById('connection-status').innerText = "3D Engine Ready - Materials Loaded";
    
    // Animation loop
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();
    
    console.log("CND 3D Environment initialized. Red and Gold materials ready.");
</script>

</body>
</html>
