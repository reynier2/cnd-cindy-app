<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CND Digital - 3D Environment</title>
    <style>
        /* Strip out all restaurant styling. Reset to a clean, full-screen 3D canvas. */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #1a1a1a; /* Dark background for 3D contrast */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* This is the container where Cindy will render the 3D world */
        #cnd-3d-world {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Optional: A subtle UI overlay for connection status */
        #cnd-ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none; /* Let clicks pass through to the 3D world */
        }
    </style>
</head>
<body>

    <!-- The 3D Canvas Container -->
    <div id="cnd-3d-world"></div>

    <!-- Simple Status Overlay -->
    <div id="cnd-ui-overlay">
        CND Digital Environment: <span id="connection-status">Initializing...</span>
    </div>

    <!-- The Seed: Connection and Rendering Logic will go here -->
    <script>
        // This is where we will inject the Three.js setup and the phone connection logic.
        // For now, it's a clean slate.
        console.log("CND 3D Environment initialized. Ready for spatial data.");
        
        document.getElementById('connection-status').innerText = "Awaiting Phone Connection...";
    </script>

</body>
</html>
