<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CND - Camry World</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
        #status {
            position: absolute; top: 10px; left: 10px; color: white; 
            font-family: sans-serif; background: rgba(0,0,0,0.5); padding: 5px;
        }
    </style>
    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="status">Loading...</div>

    <script>
        // 1. Setup Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        // 2. Setup Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6; // Moved back a bit to see the whole car

        // 3. Setup Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. Load the Camry
        const loader = new THREE.TextureLoader();
        
        // This matches your file exactly
        const texture = loader.load('camry.jpg', 
            function() {
                document.getElementById('status').innerText = "✅ Camry Loaded";
            },
            undefined,
            function(err) {
                document.getElementById('status').innerText = "❌ Error loading camry.jpg";
                console.error(err);
            }
        );

        // 5. Create the Car Mesh
        const geometry = new THREE.PlaneGeometry(6, 3.5); // Wide enough for the car
        const material = new THREE.MeshBasicMaterial({ 
            map: texture, 
            side: THREE.DoubleSide 
        });
        const camry = new THREE.Mesh(geometry, material);
        scene.add(camry);

        // 6. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
