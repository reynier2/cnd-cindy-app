<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CND - Spatial Controller</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
  body { margin: 0; padding: 0; background: #0a0a0a; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
  
  #top-view { 
    height: 55vh; width: 100%; position: relative; background: #111;
    border-bottom: 2px solid #ffb703;
  }
  #canvas-container { width: 100%; height: 100%; display: block; }
  
  #ui-overlay {
    position: absolute; top: 15px; left: 0; width: 100%; text-align: center;
    pointer-events: none; z-index: 10;
  }
  #ui-overlay h1 { color: #ffb703; font-size: 1.2rem; letter-spacing: 3px; margin: 0; text-shadow: 0 0 10px #000; }
  #ui-overlay p { color: #888; font-size: 0.8rem; margin: 5px 0 0 0; }
  #live-dot {
    display: inline-block; width: 8px; height: 8px; background: #00ff00;
    border-radius: 50%; box-shadow: 0 0 8px #00ff00; margin-right: 5px;
  }
  #coords {
    position: absolute; bottom: 10px; right: 10px; color: #00ff00; 
    font-family: monospace; font-size: 0.8rem; z-index: 10; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px;
  }
  
  #bottom-controls { 
    height: 45vh; width: 100%; background: #111; 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 15px; box-sizing: border-box;
  }
  h2 { color: #ffb703; margin: 0 0 20px 0; font-size: 1.2rem; letter-spacing: 2px; text-align: center; }
  
  .dpad { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .dpad-row { display: flex; gap: 10px; }
  
  .dpad-btn {
    width: 70px; height: 70px; border: 2px solid #ffb703; border-radius: 15px;
    background: #1a1a1a; color: #ffb703; font-size: 2rem; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    box-shadow: 0 0 10px rgba(255, 183, 3, 0.2); transition: all 0.1s;
  }
  .dpad-btn:active, .dpad-btn.active {
    background: #ffb703; color: #000; box-shadow: 0 0 20px #ffb703; transform: scale(0.95);
  }
</style>
</head>
<body>

<div id="top-view">
  <div id="ui-overlay">
    <h1>CND SPATIAL ENGINE</h1>
    <p><span id="live-dot"></span> READY FOR AVATAR BINDING</p>
  </div>
  <div id="coords">X: 0.0 | Z: 0.0</div>
  <div id="canvas-container"></div>
</div>

<div id="bottom-controls">
  <h2>NAVIGATE THE SPACE</h2>
  <div class="dpad">
    <button id="btn-up" class="dpad-btn">▲</button>
    <div class="dpad-row">
      <button id="btn-left" class="dpad-btn">◄</button>
      <button id="btn-right" class="dpad-btn">►</button>
    </div>
    <button id="btn-down" class="dpad-btn">▼</button>
  </div>
</div>

<script>
// 1. SCENE SETUP
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111); // Clean, dark background

// 2. CAMERA & RENDERER
const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 15, 20); // Elevated view to see the floor clearly

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// 3. CONTROLS & LIGHTING
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.maxPolarAngle = Math.PI / 2 - 0.1;

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

// 4. THE CLEAN FLOOR (Grid for spatial reference)
const gridHelper = new THREE.GridHelper(100, 100, 0xffb703, 0x333333);
scene.add(gridHelper);

const floorGeo = new THREE.PlaneGeometry(100, 100);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// 5. MOVEMENT LOGIC (KEEPING YOUR EXACT CONTROLS)
const moveState = { up: false, down: false, left: false, right: false };
const speed = 0.3; 
const bounds = { xMin: -45, xMax: 45, zMin: -45, zMax: 45 }; 

function setupDpad() {
  const buttons = { 
    up: document.getElementById('btn-up'), 
    down: document.getElementById('btn-down'), 
    left: document.getElementById('btn-left'), 
    right: document.getElementById('btn-right') 
  };
  
  Object.keys(buttons).forEach(dir => {
    const btn = buttons[dir];
    const startMove = (e) => { e.preventDefault(); moveState[dir] = true; btn.classList.add('active'); };
    const stopMove = (e) => { e.preventDefault(); moveState[dir] = false; btn.classList.remove('active'); };
    
    btn.addEventListener('mousedown', startMove);
    btn.addEventListener('touchstart', startMove, {passive: false});
    btn.addEventListener('mouseup', stopMove);
    btn.addEventListener('mouseleave', stopMove);
    btn.addEventListener('touchend', stopMove);
  });
}

function updateMovement() {
  let dx = 0, dz = 0;
  if (moveState.up) dz -= speed;
  if (moveState.down) dz += speed;
  if (moveState.left) dx -= speed;
  if (moveState.right) dx += speed;

  // Move camera and controls target together
  camera.position.x += dx; camera.position.z += dz;
  controls.target.x += dx; controls.target.z += dz;

  // Enforce boundaries
  camera.position.x = Math.max(bounds.xMin, Math.min(bounds.xMax, camera.position.x));
  camera.position.z = Math.max(bounds.zMin, Math.min(bounds.zMax, camera.position.z));
  controls.target.x = Math.max(bounds.xMin, Math.min(bounds.xMax, controls.target.x));
  controls.target.z = Math.max(bounds.zMin, Math.min(bounds.zMax, controls.target.z));

  document.getElementById('coords').innerText = `X: ${camera.position.x.toFixed(1)} | Z: ${camera.position.z.toFixed(1)}`;
}

// 6. ANIMATION LOOP
function animate() {
  requestAnimationFrame(animate);
  updateMovement(); 
  controls.update();
  renderer.render(scene, camera);
}

// 7. INITIALIZATION
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

setupDpad();
animate();
</script>
</body>
