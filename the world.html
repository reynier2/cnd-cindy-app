<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CND - The World</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { margin: 0; padding: 0; background: #0a0a0a; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
  
  #canvas-container { width: 100vw; height: 100vh; display: block; }
  
  #ui-overlay {
    position: absolute; top: 20px; left: 0; width: 100%; text-align: center;
    pointer-events: none; z-index: 10;
  }
  #ui-overlay h1 { 
    color: #ffb703; font-size: 1.5rem; letter-spacing: 4px; margin: 0; 
    text-shadow: 0 0 15px #ffb703; 
  }
  #ui-overlay p { color: #888; font-size: 0.9rem; margin: 5px 0 0 0; }
  #live-dot {
    display: inline-block; width: 10px; height: 10px; background: #00ff00;
    border-radius: 50%; box-shadow: 0 0 10px #00ff00; margin-right: 5px;
  }
</style>
</head>
<body>

<div id="ui-overlay">
  <h1>CND THE WORLD</h1>
  <p><span id="live-dot"></span> LIVE PROJECTION ACTIVE</p>
</div>

<div id="canvas-container"></div>

<script>
const SUPABASE_URL = 'https://mkvpuawmkudezotbhmxl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdnB1YXdta3VkZXpvdGJobXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODM0ODUsImV4cCI6MjEwMjc1OTQ4NX0.O5QIeyMGf4Dk3iFw3GagmNWg1t4B2XT0Y1tvanz7hwE';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MENU_CATEGORIES = {
  'Tacos': ['Tacos'],
  'Quesabirrias': ['Quesabirrias'],
  'Gorditas & Sopes': ['Gorditas', 'Sopes'],
  'Burritos': ['Burritos'],
  'Specials': ['Pollo Frito Chapin', 'Flautas de Pollo']
};

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a); 
scene.fog = new THREE.Fog(0x1a1a1a, 20, 80);

const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 15, 20); 

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.maxPolarAngle = Math.PI / 2 - 0.1;

const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

// --- FLOOR ---
const textureLoader = new THREE.TextureLoader();
const satelliteMapUrl = 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'; 
const floorGeo = new THREE.PlaneGeometry(100, 100);
const floorMat = new THREE.MeshStandardMaterial({ map: textureLoader.load(satelliteMapUrl), roughness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// --- AVATAR MANAGEMENT ---
const activePlayers = {};

function createAvatarMesh(playerId, color, labelText) {
  // The physical body
  const avatarGeo = new THREE.CapsuleGeometry(0.8, 2, 4, 16);
  const avatarMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.3 });
  const avatar = new THREE.Mesh(avatarGeo, avatarMat);
  avatar.position.set(0, 1.5, 0);
  avatar.castShadow = true;
  scene.add(avatar);

  // The name tag floating above
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 512; canvas.height = 128;
  ctx.font = 'Bold 72px Arial';
  ctx.fillStyle = '#ffb703';
  ctx.textAlign = 'center';
  ctx.fillText(labelText, 256, 86);
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
  label.scale.set(8, 2, 1);
  label.position.set(0, 4, 0);
  scene.add(label);

  activePlayers[playerId] = { avatar, label };
}

function updatePlayerPosition(playerId, x, z) {
  if (!activePlayers[playerId]) {
    // Determine color and name based on ID
    const isPlayer1 = playerId.includes('1');
    const color = isPlayer1 ? 0x00aaff : 0xffea00;
    const name = isPlayer1 ? 'PLAYER 1' : 'PLAYER 2';
    createAvatarMesh(playerId, color, name);
  }
  
  // Move the avatar and label
  activePlayers[playerId].avatar.position.x = x;
  activePlayers[playerId].avatar.position.z = z;
  activePlayers[playerId].label.position.x = x;
  activePlayers[playerId].label.position.z = z;
}

// --- BUILDING LOGIC ---
let map3DObjects = {};

function createRealisticBuilding(name, xPos, zPos, imageUrl) {
  const width = 3; const height = 4; const depth = 3;
  const geometry = new THREE.BoxGeometry(width, height, depth);
  const buildingTexture = textureLoader.load(imageUrl);
  const material = new THREE.MeshStandardMaterial({ map: buildingTexture, roughness: 0.7 });
  const building = new THREE.Mesh(geometry, material);
  building.position.set(xPos, height / 2, zPos);
  building.castShadow = true;
  building.receiveShadow = true;
  building.userData = { name: name };
  scene.add(building);
  map3DObjects[name] = building;
}

async function syncMapProjection() {
  const { data, error } = await supabaseClient.from('menu').select('*').order('category');
  if (error) return;

  Object.values(map3DObjects).forEach(mesh => scene.remove(mesh));
  map3DObjects = {};

  let xPos = -6; let zPos = -2;

  Object.keys(MENU_CATEGORIES).forEach((cat) => {
    MENU_CATEGORIES[cat].forEach((name) => {
      const item = data.find(m => m.name === name);
      if (!item) return;
      
      const propertyImageUrl = item.image_url || 'https://threejs.org/examples/textures/crate.gif'; 
      createRealisticBuilding(name, xPos, zPos, propertyImageUrl);
      
      xPos += 4;
      if (xPos > 6) { xPos = -6; zPos += 4; }
    });
  });
}

// --- SUPABASE REALTIME LISTENER ---
async function initWorld() {
  // 1. Get current positions on load
  const { data } = await supabaseClient.from('player_positions').select('*');
  if (data) {
    data.forEach(p => updatePlayerPosition(p.id, p.x_pos, p.z_pos));
  }

  // 2. Listen for live movements
  supabaseClient
    .channel('world-room')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'player_positions' }, (payload) => {
      if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
        updatePlayerPosition(payload.new.id, payload.new.x_pos, payload.new.z_pos);
      } else if (payload.eventType === 'DELETE') {
        if (activePlayers[payload.old.id]) {
          scene.remove(activePlayers[payload.old.id].avatar);
          scene.remove(activePlayers[payload.old.id].label);
          delete activePlayers[payload.old.id];
        }
      }
    })
    .subscribe();
}

// --- ANIMATION LOOP ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

syncMapProjection();
setInterval(syncMapProjection, 5000);
initWorld();
</script>
</body>
</html>
