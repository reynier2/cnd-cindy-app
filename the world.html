<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CND - Player 2 Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { margin: 0; padding: 0; background: #0a0a0a; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
  
  #top-view { 
    height: 55vh; width: 100%; position: relative; background: #000;
    border-bottom: 2px solid #ffb703; overflow: hidden;
  }
  
  /* LIVE CAMERA FEED AS BACKGROUND */
  #webcam {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); z-index: 1;
  }
  
  /* 3D CANVAS OVERLAY (Transparent so camera shows through) */
  #canvas-container { 
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
    display: block; z-index: 2; pointer-events: none; 
  }
  
  #ui-overlay {
    position: absolute; top: 15px; left: 0; width: 100%; text-align: center;
    pointer-events: none; z-index: 10;
  }
  #ui-overlay h1 { color: #ffb703; font-size: 1.2rem; letter-spacing: 3px; margin: 0; text-shadow: 0 0 10px #000; }
  #ui-overlay p { color: #00ff00; font-size: 0.8rem; margin: 5px 0 0 0; font-weight: bold; }
  
  #coords {
    position: absolute; bottom: 10px; right: 10px; color: #00ff00; 
    font-family: monospace; font-size: 0.8rem; z-index: 10; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px;
  }
  
  #bottom-controls { 
    height: 45vh; width: 100%; background: #111; 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 15px; box-sizing: border-box;
  }
  h2 { color: #ffb703; margin: 0 0 20px 0; font-size: 1.2rem; letter-spacing: 2px; text-align: center; }
  
  .dpad { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .dpad-row { display: flex; gap: 10px; }
  
  .dpad-btn {
    width: 70px; height: 70px; border: 2px solid #ffb703; border-radius: 15px;
    background: #1a1a1a; color: #ffb703; font-size: 2rem; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    box-shadow: 0 0 10px rgba(255, 183, 3, 0.2); transition: all 0.1s;
  }
  .dpad-btn:active, .dpad-btn.active {
    background: #ffb703; color: #000; box-shadow: 0 0 20px #ffb703; transform: scale(0.95);
  }
</style>
</head>
<body>

<div id="top-view">
  <!-- Live Camera Feed -->
  <video id="webcam" autoplay playsinline muted></video>
  
  <div id="ui-overlay">
    <h1>PLAYER 2 LIVE</h1>
    <p><span id="live-dot" style="display:inline-block;width:8px;height:8px;background:#00ff00;border-radius:50%;box-shadow:0 0 8px #00ff00;margin-right:5px;"></span> FEED ACTIVE & SYNCING</p>
  </div>
  <div id="coords">X: 0.0 | Z: 0.0</div>
  
  <!-- 3D Overlay for Kitchen Board Projections -->
  <div id="canvas-container"></div>
</div>

<div id="bottom-controls">
  <h2>NAVIGATE THE SPACE</h2>
  <div class="dpad">
    <button id="btn-up" class="dpad-btn">▲</button>
    <div class="dpad-row">
      <button id="btn-left" class="dpad-btn">◄</button>
      <button id="btn-right" class="dpad-btn">►</button>
    </div>
    <button id="btn-down" class="dpad-btn">▼</button>
  </div>
</div>

<script>
// 1. SUPABASE CONNECTION
const SUPABASE_URL = 'https://mkvpuawmkudezotbhmxl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdnB1YXdta3VkZXpvdGJobXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODM0ODUsImV4cCI6MjEwMjc1OTQ4NX0.O5QIeyMGf4Dk3iFw3GagmNWg1t4B2XT0Y1tvanz7hwE';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const playerId = 'player2'; // This identifies this phone as Player 2

// 2. SCENE SETUP (Transparent background for AR)
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
// scene.background is intentionally left out so the camera video shows through

const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 15, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // alpha: true makes it transparent
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;

// 3. LIGHTING (So projected items from Kitchen Board will be visible)
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// 4. LIVE CAMERA INITIALIZATION
const video = document.getElementById('webcam');
navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
  .then(stream => {
    video.srcObject = stream;
  })
  .catch(err => {
    console.error("Camera error:", err);
    document.getElementById('ui-overlay').innerHTML = "<h1>CAMERA DENIED</h1><p>Allow camera access to use Player 2</p>";
  });

// 5. MOVEMENT LOGIC
const moveState = { up: false, down: false, left: false, right: false };
const speed = 0.3; 
const bounds = { xMin: -45, xMax: 45, zMin: -45, zMax: 45 }; 
let lastSyncTime = 0;

function setupDpad() {
  const buttons = { 
    up: document.getElementById('btn-up'), 
    down: document.getElementById('btn-down'), 
    left: document.getElementById('btn-left'), 
    right: document.getElementById('btn-right') 
  };
  
  Object.keys(buttons).forEach(dir => {
    const btn = buttons[dir];
    const startMove = (e) => { e.preventDefault(); moveState[dir] = true; btn.classList.add('active'); };
    const stopMove = (e) => { e.preventDefault(); moveState[dir] = false; btn.classList.remove('active'); };
    
    btn.addEventListener('mousedown', startMove);
    btn.addEventListener('touchstart', startMove, {passive: false});
    btn.addEventListener('mouseup', stopMove);
    btn.addEventListener('mouseleave', stopMove);
    btn.addEventListener('touchend', stopMove);
  });
}

// Send position to Kitchen Board via Supabase
async function sendPosition(x, z) {
  const { error } = await supabase
    .from('player_positions')
    .upsert({ id: playerId, x_pos: x, z_pos: z }, { onConflict: 'id' });
  if (error) console.error('Sync error:', error);
}

function updateMovement() {
  let dx = 0, dz = 0;
  if (moveState.up) dz -= speed;
  if (moveState.down) dz += speed;
  if (moveState.left) dx -= speed;
  if (moveState.right) dx += speed;

  if (dx !== 0 || dz !== 0) {
    camera.position.x += dx; camera.position.z += dz;
    controls.target.x += dx; controls.target.z += dz;

    camera.position.x = Math.max(bounds.xMin, Math.min(bounds.xMax, camera.position.x));
    camera.position.z = Math.max(bounds.zMin, Math.min(bounds.zMax, camera.position.z));
    controls.target.x = Math.max(bounds.xMin, Math.min(bounds.xMax, controls.target.x));
    controls.target.z = Math.max(bounds.zMin, Math.min(bounds.zMax, controls.target.z));

    document.getElementById('coords').innerText = `X: ${controls.target.x.toFixed(1)} | Z: ${controls.target.z.toFixed(1)}`;

    // Throttled sync to Kitchen Board (every 150ms)
    const now = Date.now();
    if (now - lastSyncTime > 150) {
      sendPosition(controls.target.x, controls.target.z);
      lastSyncTime = now;
    }
  }
}

// 6. ANIMATION LOOP
function animate() {
  requestAnimationFrame(animate);
  updateMovement(); 
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

setupDpad();
animate();
</script>
</body>
</html>
