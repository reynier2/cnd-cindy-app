<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CND - Kitchen Command Board (3D)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin: 0; padding: 0; background: #050505; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
  
  /* TOP HALF: THE 3D CITY BLOCK */
  #top-view { 
    height: 55vh; width: 100%; position: relative; background: #050505;
    border-bottom: 2px solid #ffb703;
  }
  #canvas-container { width: 100%; height: 100%; display: block; }
  
  /* UI OVERLAY */
  #ui-overlay {
    position: absolute; top: 15px; left: 0; width: 100%; text-align: center;
    pointer-events: none; z-index: 10;
  }
  #ui-overlay h1 {
    color: #ffb703; font-size: 1.5rem; letter-spacing: 3px; margin: 0;
    text-shadow: 0 0 10px #ffb703;
  }
  #live-indicator {
    display: inline-flex; align-items: center; gap: 8px;
    color: #00ff00; font-size: 0.9rem; margin-top: 5px;
  }
  #live-dot {
    display: inline-block; width: 8px; height: 8px; background: #00ff00;
    border-radius: 50%; box-shadow: 0 0 8px #00ff00; animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  #coords {
    position: absolute; bottom: 10px; right: 10px; color: #00ff00; 
    font-family: monospace; font-size: 0.9rem; z-index: 10;
    background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px;
  }
  
  /* BOTTOM HALF: CONTROLS */
  #bottom-controls { 
    height: 45vh; width: 100%; background: #111; 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 15px; box-sizing: border-box;
  }
  h2 { color: #ffb703; margin: 0 0 20px 0; font-size: 1.2rem; letter-spacing: 2px; text-align: center; }
  
  .dpad { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .dpad-row { display: flex; gap: 10px; }
  
  .dpad-btn {
    width: 70px; height: 70px; border: 2px solid #ffb703; border-radius: 15px;
    background: #1a1a1a; color: #ffb703; font-size: 2rem; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    user-select: none; touch-action: manipulation;
    box-shadow: 0 0 10px rgba(255, 183, 3, 0.2); transition: all 0.1s;
  }
  .dpad-btn:active, .dpad-btn.active {
    background: #ffb703; color: #000; box-shadow: 0 0 20px #ffb703; transform: scale(0.95);
  }
</style>
</head>
<body>

<!-- TOP HALF: 3D CITY BLOCK -->
<div id="top-view">
  <div id="ui-overlay">
    <h1>CND CITY BLOCK</h1>
    <div id="live-indicator"><span id="live-dot"></span> LIVE STREAM ACTIVE</div>
  </div>
  <div id="coords">X: 0.0 | Z: 0.0</div>
  <div id="canvas-container"></div>
</div>

<!-- BOTTOM HALF: NAVIGATION -->
<div id="bottom-controls">
  <h2>NAVIGATE THE WORLD</h2>
  <div class="dpad">
    <button id="btn-up" class="dpad-btn">▲</button>
    <div class="dpad-row">
      <button id="btn-left" class="dpad-btn"></button>
      <button id="btn-right" class="dpad-btn">►</button>
    </div>
    <button id="btn-down" class="dpad-btn">▼</button>
  </div>
</div>

<script>
// ==========================================
// CONFIGURATION
// ==========================================
const SUPABASE_URL = 'https://mkvpuawmkudezotbhmxl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdnB1YXdta3VkZXpvdGJobXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODM0ODUsImV4cCI6MjEwMjc1OTQ4NX0.O5QIeyMGf4Dk3iFw3GagmNWg1t4B2XT0Y1tvanz7hwE';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ==========================================
// 3D WORLD SETUP (MATCHES PHONE EXACTLY)
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.Fog(0x050505, 15, 60);

const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 12, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.maxPolarAngle = Math.PI / 2 - 0.1;

// Lighting
const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// Grid Floor
const gridHelper = new THREE.GridHelper(100, 100, 0x333333, 0x222222);
scene.add(gridHelper);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Building storage
let menu3DObjects = {};

// ==========================================
// CREATE BUILDING FUNCTION
// ==========================================
function createBuildingTexture(baseColorHex) {
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#' + new THREE.Color(baseColorHex).getHexString();
  ctx.fillRect(0, 0, 64, 128);
  
  // Add windows
  for(let y = 10; y < 110; y += 20) {
    for(let x = 8; x < 56; x += 18) {
      ctx.fillStyle = Math.random() > 0.4 ? '#ffeeaa' : '#1a1a2e';
      ctx.fillRect(x, y, 12, 15);
    }
  }
  
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter;
  return tex;
}

function createDetailedBuilding(name, height, color, xPos, zPos) {
  const width = 1.5;
  const depth = 1.5;
  const texture = createBuildingTexture(color);
  const material = new THREE.MeshLambertMaterial({ map: texture });
  const geometry = new THREE.BoxGeometry(width, height, depth);
  const building = new THREE.Mesh(geometry, material);
  building.position.set(xPos, height / 2, zPos);
  building.castShadow = true;
  building.receiveShadow = true;
  building.userData = { name: name };
  scene.add(building);
  return building;
}

// ==========================================
// SYNC WITH SUPABASE
// ==========================================
async function syncKitchenProjection() {
  const { data, error } = await supabaseClient.from('menu').select('*').order('category');
  if (error) {
    console.error("Error fetching menu:", error);
    return;
  }

  // Clear old buildings
  Object.values(menu3DObjects).forEach(mesh => scene.remove(mesh));
  menu3DObjects = {};

  let xPos = -6;
  let zPos = -2;
  const buildingColors = [0x556677, 0x776655, 0x667766, 0x665577, 0x775566];

  const MENU_CATEGORIES = {
    'Tacos': ['Tacos'],
    'Quesabirrias': ['Quesabirrias'],
    'Gorditas & Sopes': ['Gorditas', 'Sopes'],
    'Burritos': ['Burritos'],
    'Specials': ['Pollo Frito Chapin', 'Flautas de Pollo']
  };

  Object.keys(MENU_CATEGORIES).forEach((cat, catIndex) => {
    MENU_CATEGORIES[cat].forEach((name, itemIndex) => {
      const item = data.find(m => m.name === name);
      if (!item) return;
      
      const currentStatus = item.status || 'green';
      // Green = Tall (5), Yellow = Medium (4), Red = Short (3)
      const height = currentStatus === 'green' ? 5 : (currentStatus === 'yellow' ? 4 : 3);
      const color = buildingColors[(catIndex * 3 + itemIndex) % buildingColors.length];
      
      const building = createDetailedBuilding(name, height, '#' + new THREE.Color(color).getHexString(), xPos, zPos);
      menu3DObjects[name] = building;
      
      xPos += 2.5;
      if (xPos > 6) {
        xPos = -6;
        zPos += 3;
      }
    });
  });
}

// ==========================================
// NAVIGATION CONTROLS
// ==========================================
const moveState = { up: false, down: false, left: false, right: false };
const speed = 0.2; 
const bounds = { xMin: -20, xMax: 20, zMin: -15, zMax: 15 }; 

function setupDpad() {
  const buttons = {
    up: document.getElementById('btn-up'),
    down: document.getElementById('btn-down'),
    left: document.getElementById('btn-left'),
    right: document.getElementById('btn-right')
  };

  Object.keys(buttons).forEach(dir => {
    const btn = buttons[dir];
    const startMove = (e) => { e.preventDefault(); moveState[dir] = true; btn.classList.add('active'); };
    const stopMove = (e) => { e.preventDefault(); moveState[dir] = false; btn.classList.remove('active'); };
    
    btn.addEventListener('mousedown', startMove);
    btn.addEventListener('touchstart', startMove, {passive: false});
    btn.addEventListener('mouseup', stopMove);
    btn.addEventListener('mouseleave', stopMove);
    btn.addEventListener('touchend', stopMove);
  });
}

function updateMovement() {
  let dx = 0, dz = 0;
  if (moveState.up) dz -= speed;
  if (moveState.down) dz += speed;
  if (moveState.left) dx -= speed;
  if (moveState.right) dx += speed;

  camera.position.x += dx; camera.position.z += dz;
  controls.target.x += dx; controls.target.z += dz;

  camera.position.x = Math.max(bounds.xMin, Math.min(bounds.xMax, camera.position.x));
  camera.position.z = Math.max(bounds.zMin, Math.min(bounds.zMax, camera.position.z));
  controls.target.x = Math.max(bounds.xMin, Math.min(bounds.xMax, controls.target.x));
  controls.target.z = Math.max(bounds.zMin, Math.min(bounds.zMax, controls.target.z));

  document.getElementById('coords').innerText = `X: ${camera.position.x.toFixed(1)} | Z: ${camera.position.z.toFixed(1)}`;
}

// ==========================================
// ANIMATION LOOP
// ==========================================
function animate() {
  requestAnimationFrame(animate);
  updateMovement(); 
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

setupDpad();

// 🔄 INITIAL SYNC AND LIVE UPDATES
syncKitchenProjection();
setInterval(syncKitchenProjection, 5000);
</script>
</body>
</html>
