<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Online — Angela's Italian</title>
<script src="https://jsdelivr.net"></script>
<style>
  :root { --bg: #140b06; --card: #1f130a; --gold: #ffb703; --red: #8a1c1c; --cream: #fff3e0; --dim: #c9a27a; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { background: var(--bg); color: var(--cream); padding-bottom: 110px; }
  
  header { text-align: center; padding: 24px 16px 14px; border-bottom: 2px solid rgba(255, 183, 3, 0.3); }
  h1 { font-size: 1.9rem; letter-spacing: 3px; color: var(--gold); font-family: Georgia, serif; }
  .tag { color: var(--dim); font-size: 0.75rem; letter-spacing: 2px; margin-top: 6px; }
  .back-link { display: inline-block; margin-top: 10px; color: var(--gold); text-decoration: none; font-size: 0.85rem; border: 1px solid var(--gold); padding: 5px 14px; border-radius: 20px; }

  .container { max-width: 820px; margin: 20px auto; padding: 0 16px; }
  .category { margin-bottom: 26px; }
  .category h2 { color: var(--gold); font-size: 1.1rem; letter-spacing: 2px; margin-bottom: 12px; border-left: 4px solid var(--red); padding-left: 10px; font-family: Georgia, serif; }

  .item-card { background: var(--card); border: 1px solid rgba(255, 183, 3, 0.25); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .item-card.sold-out { opacity: 0.45; border-color: var(--red); }
  .item-info { flex: 1; }
  .item-name { font-weight: 700; font-size: 1rem; color: var(--cream); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-price { color: var(--gold); font-weight: 700; margin-top: 4px; font-size: 0.95rem; }

  .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 800; text-transform: uppercase; }
  .badge-low { background: #ffc107; color: #000; }
  .badge-sold { background: #dc3545; color: #fff; }

  .qty-controls { display: flex; align-items: center; gap: 10px; }
  .qty-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--gold); background: transparent; color: var(--gold); font-size: 1.2rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty-btn:active { background: var(--gold); color: var(--bg); }
  .qty-btn:disabled { border-color: #555; color: #555; cursor: not-allowed; }
  .qty-val { font-weight: bold; min-width: 20px; text-align: center; font-size: 1.05rem; }

  /* CHECKOUT FORM */
  .checkout-box { background: var(--card); border: 2px solid var(--gold); border-radius: 14px; padding: 20px; margin-top: 30px; }
  .checkout-box h2 { color: var(--gold); font-size: 1.15rem; letter-spacing: 2px; margin-bottom: 16px; font-family: Georgia, serif; }
  .form-group { margin-bottom: 14px; }
  label { display: block; color: var(--dim); font-size: 0.85rem; margin-bottom: 6px; letter-spacing: 1px; }
  input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 183, 3, 0.4); background: var(--bg); color: var(--cream); font-size: 1rem; }
  input:focus, select:focus { outline: none; border-color: var(--gold); }

  .summary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed rgba(201, 162, 122, 0.25); font-size: 0.95rem; }
  .total-row { display: flex; justify-content: space-between; padding: 14px 0 6px; font-size: 1.25rem; font-weight: 800; color: var(--gold); }

  .submit-btn { width: 100%; margin-top: 16px; background: linear-gradient(135deg, var(--gold), #b8860b); border: none; color: var(--bg); font-weight: 800; font-size: 1.05rem; letter-spacing: 1.5px; padding: 15px; border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 183, 3, 0.4); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* SUCCESS OVERLAY */
  #success-screen { display: none; text-align: center; background: var(--card); border: 2px solid #28a745; border-radius: 16px; padding: 36px 20px; margin-top: 30px; }
  #success-screen h2 { color: #28a745; font-size: 1.6rem; margin-bottom: 10px; }
  #success-screen p { color: var(--cream); line-height: 1.6; margin-bottom: 20px; }
</style>
</head>
<body>

<header>
  <h1>ANGELA'S ITALIAN</h1>
  <div class="tag">FRESH TO ORDER · PICKUP IN SPOTSYLVANIA</div>
  <a href="index.html" class="back-link">← Back to Main Menu</a>
</header>

<div class="container" id="order-container">
  <div id="menu-sections"></div>

  <div class="checkout-box">
    <h2>📋 YOUR ORDER DETAILS</h2>
    <div id="cart-summary"><p style="color: var(--dim); font-size: 0.9rem;">Your cart is empty. Tap + on any dish above to add it.</p></div>
    <div class="total-row">
      <span>TOTAL</span>
      <span id="cart-total">$0.00</span>
    </div>

    <form id="order-form" style="margin-top: 18px;">
      <div class="form-group">
        <label>YOUR NAME *</label>
        <input type="text" id="cust-name" required placeholder="e.g. Maria Rossi">
      </div>
      <div class="form-group">
        <label>PHONE NUMBER *</label>
        <input type="tel" id="cust-phone" required placeholder="e.g. (540) 555-0199">
      </div>
      <div class="form-group">
        <label>PICKUP TIME</label>
        <select id="pickup-time">
          <option value="ASAP (15-25 mins)">ASAP (15–25 mins)</option>
          <option value="In 30 minutes">In 30 minutes</option>
          <option value="In 45 minutes">In 45 minutes</option>
          <option value="In 1 hour">In 1 hour</option>
        </select>
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">🚀 SEND ORDER TO KITCHEN</button>
    </form>
  </div>
</div>

<div class="container" id="success-screen">
  <h2>✅ ORDER RECEIVED!</h2>
  <p id="success-details">Grazie! Your order has been sent directly to Angela's kitchen.</p>
  <button class="submit-btn" style="max-width: 260px;" onclick="location.reload()">Place Another Order</button>
</div>

<script>
const SUPABASE_URL = 'https://supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdnB1YXdta3VkZXpvdGJobXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODM0ODUsImV4cCI6MjEwMjc1OTQ4NX0.O5QIeyMGf4Dk3iFw3GagmNWg1t4B2XT0Y1tvanz7hwE';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MENU_DATA = [
  { cat: "APPETIZERS", items: [
    { name: "Fresh Garlic Knots", price: 5.99 },
    { name: "Toasted Ravioli", price: 8.99 },
    { name: "Classic Calzone", price: 10.99 }
  ]},
  { cat: "PASTA & ENTREES", items: [
    { name: "Homemade Vodka Cream Sauce", price: 16.99 },
    { name: "Chicken Parmigiana", price: 18.99 },
    { name: "Seafood Ravioli", price: 19.99 },
    { name: "Steak & Cheese Sub", price: 12.99 }
  ]},
  { cat: "PIZZA", items: [
    { name: "Sicilian Pizza (Large)", price: 22.99 },
    { name: "Angela's Special Pizza", price: 24.99 }
  ]},
  { cat: "DRINKS & DESSERTS", items: [
    { name: "Cannoli", price: 5.99 },
    { name: "Tiramisu", price: 6.99 },
    { name: "Soft Drinks", price: 2.99 }
  ]}
];

let cart = {};
let liveStatus = {};

async function fetchLiveAvailability() {
  const { data } = await supabaseClient.from('menu_status').select('item_name, status');
  if (data) {
    data.forEach(row => { liveStatus[row.item_name] = row.status; });
  }
  renderMenu();
}

function renderMenu() {
  const container = document.getElementById('menu-sections');
  container.innerHTML = '';

  MENU_DATA.forEach(group => {
    const sec = document.createElement('div');
    sec.className = 'category';
    sec.innerHTML = `<h2>${group.cat}</h2>`;

    group.items.forEach(item => {
      const status = liveStatus[item.name] || 'green';
      const isSoldOut = status === 'red';
      const isLow = status === 'yellow';
      const qty = cart[item.name]?.qty || 0;

      if (isSoldOut && qty > 0) {
        delete cart[item.name];
        updateCartUI();
      }

      const safeName = item.name.replace(/'/g, "\\'");
      let badgeHtml = '';
      if (isSoldOut) badgeHtml = `<span class="badge badge-sold">Sold Out</span>`;
      else if (isLow) badgeHtml = `<span class="badge badge-low">Running Low</span>`;

      sec.innerHTML += `
        <div class="item-card ${isSoldOut ? 'sold-out' : ''}">
          <div class="item-info">
            <div class="item-name">${item.name} ${badgeHtml}</div>
            <div class="item-price">$${item.price.toFixed(2)}</div>
          </div>
          <div class="qty-controls">
            <button type="button" class="qty-btn" onclick="changeQty('${safeName}', ${item.price}, -1)" ${isSoldOut || qty === 0 ? 'disabled' : ''}>−</button>
            <span class="qty-val">${qty}</span>
            <button type="button" class="qty-btn" onclick="changeQty('${safeName}', ${item.price}, 1)" ${isSoldOut ? 'disabled' : ''}>+</button>
          </div>
        </div>
      `;
    });
    container.appendChild(sec);
  });
}

window.changeQty = (name, price, delta) => {
  if (!cart[name]) cart[name] = { name, price, qty: 0 };
  cart[name].qty += delta;
  if (cart[name].qty <= 0) delete cart[name];
  renderMenu();
  updateCartUI();
};

function updateCartUI() {
  const summaryDiv = document.getElementById('cart-summary');
  const totalEl = document.getElementById('cart-total');
  const keys = Object.keys(cart);

  if (keys.length === 0) {
    summaryDiv.innerHTML = `<p style="color: var(--dim); font-size: 0.9rem;">Your cart is empty. Tap + on any dish above to add it.</p>`;
    totalEl.textContent = "$0.00";
    return;
  }

  let total = 0;
  let html = '';
  keys.forEach(k => {
    const item = cart[k];
    const lineTotal = item.price * item.qty;
    total += lineTotal;
html += <div class="summary-row"><span>${item.qty}x ${item.name}</span><span>$${lineTotal.toFixed(2)}</span></div>;
});
summaryDiv.innerHTML = html;
totalEl.textContent = $${total.toFixed(2)};
}
document.getElementById('order-form').addEventListener('submit', async (e) => {
e.preventDefault();
const itemsArray = Object.values(cart);
if (itemsArray.length === 0) {
alert("Please add at least one item to your order first!");
return;
}
const btn = document.getElementById('submit-btn');
btn.disabled = true;
btn.textContent = "⏳ SENDING TO KITCHEN...";
const totalAmount = itemsArray.reduce((sum, item) => sum + (item.price * item.qty), 0);
const customerName = document.getElementById('cust-name').value.trim();
const phone = document.getElementById('cust-phone').value.trim();
const pickupTime = document.getElementById('pickup-time').value;
const { data, error } = await supabaseClient
.from('orders')
.insert([{
customer_name: customerName,
phone: phone,
pickup_time: pickupTime,
items: itemsArray,
total: totalAmount,
status: 'new'
}])
.select();
if (error) {
alert("Error sending order: " + error.message);
btn.disabled = false;
btn.textContent = "🚀 SEND ORDER TO KITCHEN";
return;
}
const orderId = data && data[0] ? data[0].id : '';
document.getElementById('order-container').style.display = 'none';
document.getElementById('success-screen').style.display = 'block';
document.getElementById('success-details').innerHTML = Grazie, <b>${customerName}</b>! Order <b>#${orderId}</b> ($${totalAmount.toFixed(2)}) is now on our kitchen screen.<br> Estimated Pickup: <b>${pickupTime}</b>.;
});
fetchLiveAvailability();
setInterval(fetchLiveAvailability, 10000);
