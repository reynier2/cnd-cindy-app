<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CND - Live Network</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { margin: 0; padding: 0; background: #0a0a0a; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
  #top-view { height: 55vh; width: 100%; position: relative; background: #111; border-bottom: 2px solid #ffb703; }
  #canvas-container { width: 100%; height: 100%; display: block; }
  #ui-overlay { position: absolute; top: 15px; left: 0; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
  #ui-overlay h1 { color: #ffb703; font-size: 1.2rem; letter-spacing: 3px; margin: 0; text-shadow: 0 0 10px #000; }
  #ui-overlay p { color: #888; font-size: 0.8rem; margin: 5px 0 0 0; }
  #live-dot { display: inline-block; width: 8px; height: 8px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 8px #00ff00; margin-right: 5px; }
  #coords { position: absolute; bottom: 10px; right: 10px; color: #00ff00; font-family: monospace; font-size: 0.8rem; z-index: 10; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; }
  #bottom-controls { height: 45vh; width: 100%; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
  h2 { color: #ffb703; margin: 0 0 20px 0; font-size: 1.2rem; letter-spacing: 2px; text-align: center; }
  .dpad { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .dpad-row { display: flex; gap: 10px; }
  .dpad-btn { width: 70px; height: 70px; border: 2px solid #ffb703; border-radius: 15px; background: #1a1a1a; color: #ffb703; font-size: 2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; touch-action: manipulation; box-shadow: 0 0 10px rgba(255, 183, 3, 0.2); transition: all 0.1s; }
  .dpad-btn:active, .dpad-btn.active { background: #ffb703; color: #000; box-shadow: 0 0 20px #ffb703; transform: scale(0.95); }
</style>
</head>
<body>

<div id="top-view">
  <div id="ui-overlay">
    <h1>CND LIVE NETWORK</h1>
    <p><span id="live-dot"></span> CONNECTED TO SUPABASE</p>
  </div>
  <div id="coords">X: 0.0 | Z: 0.0</div>
  <div id="canvas-container"></div>
</div>

<div id="bottom-controls">
  <h2>MOVE YOUR AVATAR</h2>
  <div class="dpad">
    <button id="btn-up" class="dpad-btn">▲</button>
    <div class="dpad-row">
      <button id="btn-left" class="dpad-btn">◄</button>
      <button id="btn-right" class="dpad-btn">►</button>
    </div>
    <button id="btn-down" class="dpad-btn">▼</button>
  </div>
</div>

<script>
// 1. SUPABASE CONNECTION
const SUPABASE_URL = 'https://mkvpuawmkudezotbhmxl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdnB1YXdta3VkZXpvdGJobXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODM0ODUsImV4cCI6MjEwMjc1OTQ4NX0.O5QIeyMGf4Dk3iFw3GagmNWg1t4B2XT0Y1tvanz7hwE';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 2. GET PLAYER ID FROM URL (e.g., phone.html?id=ray or ?id=mary)
const urlParams = new URLSearchParams(window.location.search);
let myPlayerId = urlParams.get('id') || 'player_ray'; // Defaults to ray if nothing is in the URL

// 3. THREE.JS SETUP
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111); 
const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

const gridHelper = new THREE.GridHelper(100, 100, 0xffb703, 0x333333);
scene.add(gridHelper);
const floorGeo = new THREE.PlaneGeometry(100, 100);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// 4. AVATAR & LABEL BUILDER
const players = {}; // Stores all avatars in the scene

function createAvatarWithLabel(color, labelText, startX, startZ, isMe) {
  // The Pin
  const pinGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 32);
  const pin = new THREE.Mesh(pinGeo, new THREE.MeshBasicMaterial({ color: 0xffb703 }));
  pin.position.set(startX, 0.1, startZ);
  scene.add(pin);

  // The Avatar Body
  const avatarGeo = new THREE.CapsuleGeometry(1.2, 3, 4, 16);
  const avatarMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.4 });
  const avatar = new THREE.Mesh(avatarGeo, avatarMat);
  avatar.position.set(startX, 2.5, startZ);
  avatar.castShadow = true;
  scene.add(avatar);

  // The Floating Label
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 512; canvas.height = 128;
  ctx.font = 'Bold 72px Arial';
  ctx.fillStyle = '#ffb703';
  ctx.textAlign = 'center';
  ctx.fillText(labelText, 256, 86);
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
  label.scale.set(8, 2, 1);
  label.position.set(startX, 6, startZ);
  scene.add(label);

  players[labelText] = { avatar, label, isMe };
  return { avatar, label };
}

// 5. INITIALIZE LOCAL AVATAR BASED ON URL ID
let myColor = 0xff0000; // Default Red for Ray
let myLabel = 'PLAYER 1 (RAY)';

if (myPlayerId.toLowerCase().includes('mary')) {
  myColor = 0x00ff00; // Green for Mary
  myLabel = 'PLAYER 2 (MARY)';
}

// Spawn ONLY the local player's avatar
createAvatarWithLabel(myColor, myLabel, 0, 0, true);

// 6. MOVEMENT & SYNC LOGIC
const moveState = { up: false, down: false, left: false, right: false };
const speed = 0.2; 
const bounds = { xMin: -45, xMax: 45, zMin: -45, zMax: 45 }; 
let lastSyncTime = 0;

function setupDpad() {
  const buttons = { up: document.getElementById('btn-up'), down: document.getElementById('btn-down'), left: document.getElementById('btn-left'), right: document.getElementById('btn-right') };
  Object.keys(buttons).forEach(dir => {
    const btn = buttons[dir];
    const startMove = (e) => { e.preventDefault(); moveState[dir] = true; btn.classList.add('active'); };
    const stopMove = (e) => { e.preventDefault(); moveState[dir] = false; btn.classList.remove('active'); };
    btn.addEventListener('mousedown', startMove); 
    btn.addEventListener('touchstart', startMove, {passive: false});
    btn.addEventListener('mouseup', stopMove); 
    btn.addEventListener('mouseleave', stopMove); 
    btn.addEventListener('touchend', stopMove);
  });
}

// SEND LOCAL POSITION TO SUPABASE
async function sendPosition(x, z) {
  const { error } = await supabase
    .from('player_positions')
    .upsert({ player_id: myPlayerId, x_pos: x, z_pos: z }, { onConflict: 'player_id' });
  if (error) console.error('Sync error:', error);
}

// LISTEN FOR OTHER PLAYERS MOVING IN REAL-TIME
supabase
  .channel('room1')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'player_positions' }, (payload) => {
    const data = payload.new;
    
    // Don't process our own updates
    if (data.player_id === myPlayerId) return;

    // Determine what to call the other player based on their ID
    const otherLabel = data.player_id.toLowerCase().includes('mary') ? 'PLAYER 2 (MARY)' : 'PLAYER 1 (RAY)';
    const otherColor = otherLabel.includes('MARY') ? 0x00ff00 : 0xff0000;
    
    // If they don't exist in our scene yet, spawn them!
    if (!players[otherLabel]) {
      createAvatarWithLabel(otherColor, otherLabel, data.x_pos, data.z_pos, false);
    } 
    
    // If they already exist, smoothly update their position
    if (players[otherLabel]) {
      players[otherLabel].avatar.position.x = data.x_pos;
      players[otherLabel].avatar.position.z = data.z_pos;
      players[otherLabel].label.position.x = data.x_pos;
      players[otherLabel].label.position.z = data.z_pos;
    }
  })
  .subscribe();

function updateMovement() {
  let dx = 0, dz = 0;
  if (moveState.up) dz -= speed;
  if (moveState.down) dz += speed;
  if (moveState.left) dx -= speed;
  if (moveState.right) dx += speed;

  const myAvatar = players[myLabel].avatar;
  const myLabelObj = players[myLabel].label;

  // Move local avatar
  myAvatar.position.x += dx; 
  myAvatar.position.z += dz;
  
  // Keep within bounds
  myAvatar.position.x = Math.max(bounds.xMin, Math.min(bounds.xMax, myAvatar.position.x));
  myAvatar.position.z = Math.max(bounds.zMin, Math.min(bounds.zMax, myAvatar.position.z));

  // Keep label attached to avatar
  myLabelObj.position.x = myAvatar.position.x;
  myLabelObj.position.z = myAvatar.position.z;

  // Camera follows local avatar
  camera.position.x = myAvatar.position.x;
  camera.position.z = myAvatar.position.z + 15;
  camera.position.y = 12;
  camera.lookAt(myAvatar.position);

  // Update UI
  document.getElementById('coords').innerText = `X: ${myAvatar.position.x.toFixed(1)} | Z: ${myAvatar.position.z.toFixed(1)}`;

  // Throttle network calls (send to Supabase only every 150ms to save bandwidth)
  const now = Date.now();
  if (now - lastSyncTime > 150 && (dx !== 0 || dz !== 0)) {
    sendPosition(myAvatar.position.x, myAvatar.position.z);
    lastSyncTime = now;
  }
}

function animate() {
  requestAnimationFrame(animate);
  updateMovement(); 
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

setupDpad();
animate();
</script>
</body>
</html>
