<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CND - Phone Controller (Outer Space)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { margin: 0; padding: 0; background: #000000; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
  
  #top-view { 
    height: 55vh; width: 100%; position: relative; background: #000000;
    border-bottom: 2px solid #ffb703;
  }
  #canvas-container { width: 100%; height: 100%; display: block; }
  
  #ui-overlay {
    position: absolute; top: 15px; left: 0; width: 100%; text-align: center;
    pointer-events: none; z-index: 10;
  }
  #ui-overlay h1 { color: #ffb703; font-size: 1.2rem; letter-spacing: 3px; margin: 0; text-shadow: 0 0 10px #000; }
  #ui-overlay p { color: #888; font-size: 0.8rem; margin: 5px 0 0 0; }
  #live-dot {
    display: inline-block; width: 8px; height: 8px; background: #00ff00;
    border-radius: 50%; box-shadow: 0 0 8px #00ff00; margin-right: 5px;
  }
  #coords {
    position: absolute; bottom: 10px; right: 10px; color: #00ff00; 
    font-family: monospace; font-size: 0.8rem; z-index: 10; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px;
  }
  
  #bottom-controls { 
    height: 45vh; width: 100%; background: #111; 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 15px; box-sizing: border-box;
  }
  h2 { color: #ffb703; margin: 0 0 20px 0; font-size: 1.2rem; letter-spacing: 2px; text-align: center; }
  
  .dpad { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .dpad-row { display: flex; gap: 10px; }
  
  .dpad-btn {
    width: 70px; height: 70px; border: 2px solid #ffb703; border-radius: 15px;
    background: #1a1a1a; color: #ffb703; font-size: 2rem; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    box-shadow: 0 0 10px rgba(255, 183, 3, 0.2); transition: all 0.1s;
  }
  .dpad-btn:active, .dpad-btn.active {
    background: #ffb703; color: #000; box-shadow: 0 0 20px #ffb703; transform: scale(0.95);
  }
</style>
</head>
<body>

<div id="top-view">
  <div id="ui-overlay">
    <h1>CND SPACE CONTROLLER</h1>
    <p><span id="live-dot"></span> LIVE TELEMETRY ACTIVE</p>
  </div>
  <div id="coords">X: 0.0 | Z: 0.0</div>
  <div id="canvas-container"></div>
</div>

<div id="bottom-controls">
  <h2>NAVIGATE THE VOID</h2>
  <div class="dpad">
    <button id="btn-up" class="dpad-btn">▲</button>
    <div class="dpad-row">
      <button id="btn-left" class="dpad-btn">◄</button>
      <button id="btn-right" class="dpad-btn">►</button>
    </div>
    <button id="btn-down" class="dpad-btn">▼</button>
  </div>
</div>

<script>
// Supabase setup kept intact for architecture
const SUPABASE_URL = 'https://mkvpuawmkudezotbhmxl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdnB1YXdta3VkZXpvdGJobXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODM0ODUsImV4cCI6MjEwMjc1OTQ4NX0.O5QIeyMGf4Dk3iFw3GagmNWg1t4B2XT0Y1tvanz7hwE';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000); 
scene.fog = new THREE.FogExp2(0x000000, 0.015);

const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 0, 5); // Centered, looking down the Z-axis

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;

// ==========================================
// 1. THE INFINITE STARFIELD
// ==========================================
const starsGeometry = new THREE.BufferGeometry();
const starsCount = 3000;
const posArray = new Float32Array(starsCount * 3);
for(let i = 0; i < starsCount * 3; i++) {
    posArray[i] = (Math.random() - 0.5) * 400;
}
starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
const starsMaterial = new THREE.PointsMaterial({ size: 0.5, color: 0xffffff });
const starField = new THREE.Points(starsGeometry, starsMaterial);
scene.add(starField);

// ==========================================
// 2. THE DRIFTING PLANETS
// ==========================================
const planetTypes = [
    { name: 'Mars', color: 0xff4500, size: 8 },
    { name: 'Earth', color: 0x2244ff, size: 10 },
    { name: 'Jupiter', color: 0xd2b48c, size: 20 }
];
let currentPlanetIndex = 0;
let side = 1; 
const planets = [];

function spawnPlanet() {
    const type = planetTypes[currentPlanetIndex % planetTypes.length];
    const geometry = new THREE.SphereGeometry(type.size, 32, 32);
    const material = new THREE.MeshBasicMaterial({ color: type.color });
    const planet = new THREE.Mesh(geometry, material);

    planet.position.x = side * 40; 
    planet.position.y = (Math.random() - 0.5) * 20;
    planet.position.z = -200; 

    scene.add(planet);
    planets.push(planet);

    side *= -1; 
    currentPlanetIndex++;
}

spawnPlanet();
setInterval(spawnPlanet, 5000);

// ==========================================
// 3. D-PAD CONTROLLER LOGIC (KEPT INTACT)
// ==========================================
const moveState = { up: false, down: false, left: false, right: false };
const speed = 0.5; // Slightly faster for space flight feel
const bounds = { xMin: -50, xMax: 50, zMin: -100, zMax: 100 }; 

function setupDpad() {
  const buttons = { up: document.getElementById('btn-up'), down: document.getElementById('btn-down'), left: document.getElementById('btn-left'), right: document.getElementById('btn-right') };
  Object.keys(buttons).forEach(dir => {
    const btn = buttons[dir];
    const startMove = (e) => { e.preventDefault(); moveState[dir] = true; btn.classList.add('active'); };
    const stopMove = (e) => { e.preventDefault(); moveState[dir] = false; btn.classList.remove('active'); };
    btn.addEventListener('mousedown', startMove);
    btn.addEventListener('touchstart', startMove, {passive: false});
    btn.addEventListener('mouseup', stopMove);
    btn.addEventListener('mouseleave', stopMove);
    btn.addEventListener('touchend', stopMove);
  });
}

function updateMovement() {
  let dx = 0, dz = 0;
  if (moveState.up) dz -= speed;
  if (moveState.down) dz += speed;
  if (moveState.left) dx -= speed;
  if (moveState.right) dx += speed;

  camera.position.x += dx; 
  camera.position.z += dz;
  controls.target.x += dx; 
  controls.target.z += dz;

  // Keep camera within bounds
  camera.position.x = Math.max(bounds.xMin, Math.min(bounds.xMax, camera.position.x));
  camera.position.z = Math.max(bounds.zMin, Math.min(bounds.zMax, camera.position.z));
  controls.target.x = Math.max(bounds.xMin, Math.min(bounds.xMax, controls.target.x));
  controls.target.z = Math.max(bounds.zMin, Math.min(bounds.zMax, controls.target.z));

  document.getElementById('coords').innerText = `X: ${camera.position.x.toFixed(1)} | Z: ${camera.position.z.toFixed(1)}`;
}

// ==========================================
// 4. ANIMATION LOOP
// ==========================================
function animate() {
  requestAnimationFrame(animate);
  
  // Update D-pad movement
  updateMovement(); 
  controls.update();

  // Animate Space Background
  starField.position.z += 0.1;
  if (starField.position.z > 50) starField.position.z = 0;

  for (let i = planets.length - 1; i >= 0; i--) {
      planets[i].position.z += 0.3; 
      planets[i].rotation.y += 0.005; 

      if (planets[i].position.z > 20) {
          scene.remove(planets[i]);
          planets.splice(i, 1);
      }
  }
  
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

setupDpad();
</script>
</body>
</html>
